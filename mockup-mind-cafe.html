<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>② 心智咖啡馆 · 大肥鱼心智图谱</title>
<style>
:root{--navy:#14275e;--ink:#fff;--soft:#dbe6ff;--mute:#a9c0f5}
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;overflow:hidden;color:var(--ink);font:14px/1.5 "PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  background:radial-gradient(900px 700px at 50% 52%,#5a8bff 0%,#3f6fe6 40%,#2f58cc 75%,#2849b2 100%)}
body:before{content:"";position:fixed;inset:0;background-image:radial-gradient(#ffffff22 1px,transparent 1.2px);background-size:22px 22px;pointer-events:none}
.mono{font-family:"SF Mono",Menlo,Consolas,monospace;letter-spacing:.16em}
.disp{font-family:"Helvetica Neue","Avenir Next",Arial,sans-serif}
.top{position:relative;height:54px;display:flex;align-items:center;padding:0 34px;font-size:11px;color:var(--soft);border-bottom:1px solid #ffffff2a}
.top b{color:#fff;font-weight:600}
.top .r{margin-left:auto;display:flex;gap:26px}
.wrap{position:relative;display:grid;grid-template-columns:330px 1fr 360px;height:calc(100vh - 54px);min-height:640px}
.left{padding:34px 0 28px 38px;display:flex;flex-direction:column}
.big{font-size:118px;line-height:.9;font-weight:300;letter-spacing:-.02em}
.big2{font-size:38px;font-weight:300;margin-top:10px;letter-spacing:.01em}
.tag{margin-top:26px;font-size:12px;font-weight:600}
.tag+p{font-size:10px;line-height:1.8;color:var(--soft);margin-top:6px}
.stile{margin-top:auto}
.stile h3{font-size:11px;font-weight:600;margin-bottom:10px}
.ck{max-width:250px;display:grid;grid-template-columns:28px 1fr auto;align-items:center;gap:12px;padding:6px 0;cursor:pointer;opacity:.92}
.ck:hover,.ck.sel{opacity:1}
.ck .box{width:26px;height:26px;border:2px solid #fff;display:grid;place-items:center;transition:background .15s}
.ck.sel .box{background:#fff}
.ck .box svg{width:20px;height:20px}
.ck.sel .box path{stroke:#2f58cc}
.ck b{font-size:15px;font-weight:600}
.ck small{display:block;font-size:9px;color:var(--soft);letter-spacing:.18em}
.ck em{font-style:normal;font-size:11px;color:var(--soft)}
.center{position:relative}
#orbit{position:absolute;inset:0;width:100%;height:100%}
.hintline{position:absolute;left:0;right:0;bottom:22px;text-align:center;font-size:11px;color:var(--soft)}
.right{padding:26px 34px 26px 0;display:flex;flex-direction:column;gap:16px;overflow:auto}
.say{position:relative;background:#fff;color:var(--navy);border-radius:18px;padding:14px 18px 14px 62px;box-shadow:0 10px 30px #0b1f6633;font-size:14px;font-weight:500}
.say img{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;object-fit:cover;object-position:50% 52%;background:#e9f0ff}
.say small{display:block;font-size:10px;color:#5d76b8;font-weight:400}
.say:after{content:"";position:absolute;left:-8px;top:24px;border:8px solid transparent;border-right-color:#fff;border-left:0}
.card{background:#fff;color:var(--navy);border-radius:18px;padding:20px 22px;box-shadow:0 10px 30px #0b1f6633}
.card h4{font-size:10px;color:#6a80bd;font-weight:500;margin-bottom:10px}
.chip{display:inline-block;font-size:10px;padding:2px 10px;border-radius:10px;color:#fff;background:#3f6fe6;letter-spacing:.1em}
.title{font-size:20px;font-weight:700;margin:10px 0 6px;line-height:1.3}
.text{color:#3c4f86;font-size:13px}
.chain{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:14px;font-size:12px}
.chain span{padding:4px 10px;border-radius:12px;background:#eef3ff;color:var(--navy);font-weight:600}
.chain i{color:#8ea3d9;font-style:normal}
.rel{display:flex;gap:10px;padding:9px 0;border-top:1px solid #e8eefb;cursor:pointer;align-items:flex-start}
.rel:first-of-type{border-top:0}
.rel:hover b{color:#2f58cc}
.rel>i{flex:none;width:9px;height:9px;border-radius:50%;margin-top:6px}
.rel b{display:block;font-size:13px}
.rel small{color:#6a80bd;font-size:11px}
.rel em{margin-left:auto;font-style:normal;font-size:10px;color:#8ea3d9;white-space:nowrap;padding-top:3px}
.moods{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;text-align:center;font-size:11px}
.moods div{cursor:pointer}
.moods i{display:block;margin:0 auto 6px;width:30px;height:30px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px #dfe7fb}
.moods .now i{box-shadow:0 0 0 3px #3f6fe6}
/* svg */
.ring{fill:none;stroke:#fff;stroke-opacity:.22;stroke-dasharray:2 6}
.spin{animation:spin 160s linear infinite;transform-origin:0 0}
.spin.rev{animation-direction:reverse;animation-duration:220s}
@keyframes spin{to{transform:rotate(360deg)}}
.ringlab{font:9px "SF Mono",Menlo,monospace;letter-spacing:.24em;fill:#dbe6ff;opacity:.8}
.edge{fill:none;stroke:#fff;stroke-opacity:.13;stroke-width:1;transition:stroke-opacity .15s}
.edge.m{stroke-opacity:.36;stroke-width:1.2}
.edge.hidden{stroke-opacity:0}
.dim .edge{stroke-opacity:.05}
.dim .edge.hidden{stroke-opacity:0}
.edge.lit,.dim .edge.lit{stroke-opacity:1;stroke-width:2;stroke-dasharray:5 6;animation:flow 1s linear infinite}
@keyframes flow{to{stroke-dashoffset:-22}}
.node{cursor:pointer;transition:opacity .15s}
.dim .node:not(.lit){opacity:.25}
.node text{fill:#fff;font-size:12.5px;font-weight:500}
.node .glyph{fill:#2f58cc;font-size:11px;font-weight:700}
.node.k-trait text{fill:var(--navy);font-size:13px;font-weight:700}
.node .hl{fill:none;stroke:#fff;stroke-width:2;opacity:0}
.node:hover .hl,.node.sel .hl{opacity:1}
.bub{fill:#fff;opacity:0;animation:rise linear infinite}
@keyframes rise{0%{transform:translateY(0);opacity:0}15%{opacity:.35}100%{transform:translateY(-520px);opacity:0}}
.core-ring{fill:none;stroke:#fff;stroke-width:2}
.core-beat{fill:none;stroke:#fff;animation:beat 3s ease-out infinite;transform-origin:0 0}
@keyframes beat{0%{transform:scale(1);opacity:.6}100%{transform:scale(1.5);opacity:0}}
@media (prefers-reduced-motion:reduce){.spin,.bub,.core-beat,.edge.lit{animation:none}}
</style>
</head>
<body>
<div class="top mono"><span><b>DAFEIYU CAFÉ</b> · MIND MAP</span>
  <div class="r"><span>CONCEPT ②</span><span>记忆 <b id="cM"></b></span><span>人格 <b>5</b></span><span>心情 <b id="cMood"></b></span></div></div>
<div class="wrap">
  <section class="left">
    <div class="big disp">Mind</div>
    <div class="big2 disp">DaFeiYu</div>
    <div class="tag mono">THE WHALE MAID'S MEMORY CAFÉ</div>
    <p class="mono">A LITTLE MEMORY, A LITTLE MOOD.<br>EVERY CUP REMEMBERS WHO SHE IS.<br>心智以人格为核，情绪为杯，记忆为豆。</p>
    <div class="stile">
      <h3 class="mono">PERSONA STILE · 人格</h3>
      <div id="stile"></div>
    </div>
  </section>
  <section class="center">
    <svg id="orbit" viewBox="-480 -410 960 820" preserveAspectRatio="xMidYMid meet">
      <defs>
        <clipPath id="coreClip"><circle r="70"/></clipPath>
        <filter id="sh" x="-50%" y="-50%" width="200%" height="200%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0b1f66" flood-opacity=".35"/></filter>
      </defs>
      <g id="bubbles"></g>
      <g id="rings"></g>
      <g id="edges"></g>
      <g id="core"></g>
      <g id="nodes"></g>
    </svg>
    <div class="hintline mono">点一颗记忆豆，看它经过哪种情绪、塑造了哪一面人格</div>
  </section>
  <section class="right">
    <div class="say"><img src="mockup-atlas-persona-chibi.png" alt=""><small>大肥鱼</small><span id="sayText"></span></div>
    <div id="panel"></div>
  </section>
</div>
<script src="mockup-mind-data.js"></script>
<script>
const M = MIND, NS = 'http://www.w3.org/2000/svg', $ = s => document.querySelector(s);
const el = (tag, a, p) => { const e = document.createElementNS(NS, tag); for (const k in a) e.setAttribute(k, a[k]); p && p.appendChild(e); return e; };
const GLYPH = { episodic: '忆', semantic: '知', attitude: '态' };
const R = { trait: 140, emotion: 225, memory: 292 };
const rad = d => d * Math.PI / 180, P = (r, a) => [Math.cos(rad(a)) * r, Math.sin(rad(a)) * r];

// ── 角度布局：记忆按人格分组排列，人格/情绪取其记忆的平均方向 ──
const order = [...M.memories].sort((a, b) => a.trait.localeCompare(b.trait) || a.emo.localeCompare(b.emo));
const ANG = {}; let a = -90; const step = (360 - 5 * 8) / order.length;
order.forEach((m, i) => { if (i && m.trait !== order[i - 1].trait) a += 8; ANG[m.id] = a; a += step; });
function meanAng(ids) { let x = 0, y = 0; ids.forEach(id => { x += Math.cos(rad(ANG[id])); y += Math.sin(rad(ANG[id])); }); return Math.atan2(y, x) * 180 / Math.PI; }
function spread(items, minGap) {
  for (let it = 0; it < 80; it++) {
    items.sort((p, q) => p.a - q.a);
    for (let i = 0; i < items.length; i++) {
      const p = items[i], q = items[(i + 1) % items.length];
      let d = (q.a - p.a + 360) % 360; if (d < minGap) { p.a -= (minGap - d) / 2; q.a += (minGap - d) / 2; }
    }
  }
  items.forEach(i => (ANG[i.id] = i.a));
}
spread(M.traits.map(t => ({ id: t.id, a: meanAng(M.memories.filter(m => m.trait === t.id).map(m => m.id)) })), 60);
spread(M.emotions.map(e => ({ id: e.id, a: meanAng(M.memories.filter(m => m.emo === e.id).map(m => m.id)) })), 58);
const POS = {}; Object.keys(ANG).forEach(id => (POS[id] = P(R[M.kindOf(id)], ANG[id])));
const COLOR = id => M.kindOf(id) === 'emotion' ? M.byId[id].color : '#ffffff';

// ── 装饰：环与泡泡 ──
const rings = $('#rings');
[[R.trait, ''], [R.emotion, 'rev'], [R.memory, '']].forEach(([r, c]) => { const g = el('g', { class: 'spin ' + c }, rings); el('circle', { r, class: 'ring' }, g); });
el('circle', { r: 372, class: 'ring', 'stroke-dasharray': '1 10', 'stroke-opacity': .3 }, rings);
const bg = $('#bubbles');
for (let i = 0; i < 16; i++) { const c = el('circle', { cx: -380 + Math.random() * 760, cy: 380, r: 2 + Math.random() * 5, class: 'bub' }, bg); c.style.animationDuration = 9 + Math.random() * 10 + 's'; c.style.animationDelay = -Math.random() * 18 + 's'; }

// ── 内核：大肥鱼 ──
const core = $('#core');
el('circle', { r: 76, class: 'core-beat' }, core);
el('circle', { r: 72, fill: '#e9f0ff', filter: 'url(#sh)' }, core);
el('image', { href: 'mockup-atlas-persona-chibi.png', x: -125, y: -108, width: 250, height: 250, 'clip-path': 'url(#coreClip)' }, core);
el('circle', { r: 72, class: 'core-ring' }, core);
const coreLab = el('text', { y: 98, 'text-anchor': 'middle', fill: '#fff', 'font-size': 13, 'font-weight': 700 }, core); coreLab.textContent = '人格内核 · 大肥鱼';
core.style.cursor = 'pointer'; core.addEventListener('click', e => { e.stopPropagation(); select(null); });

// ── 边 ──
const EDGES = [], eg = $('#edges');
const add = (a, b, cls, d) => EDGES.push({ a, b, path: el('path', { d, class: 'edge ' + cls }, eg) });
M.memories.forEach(m => {
  const [x1, y1] = POS[m.id], [x2, y2] = POS[m.trait], [cx, cy] = P(R.emotion - 10, ANG[m.id]);
  add(m.id, m.trait, '', `M${x1},${y1} Q${cx},${cy} ${x2},${y2}`);
  const [ex, ey] = POS[m.emo], [qx, qy] = P(R.memory - 30, (ANG[m.id] + ANG[m.emo]) / 2);
  add(m.id, m.emo, 'hidden', `M${x1},${y1} Q${qx},${qy} ${ex},${ey}`);
});
M.links.forEach(([p, q]) => {
  const [x1, y1] = POS[p], [x2, y2] = POS[q], [c1x, c1y] = P(R.trait - 20, ANG[p]), [c2x, c2y] = P(R.trait - 20, ANG[q]);
  add(p, q, 'm', `M${x1},${y1} C${c1x},${c1y} ${c2x},${c2y} ${x2},${y2}`);
});
M.traits.forEach(t => { const [x, y] = POS[t.id], [cx, cy] = P(74, ANG[t.id]); add(t.id, 'core', '', `M${x},${y} L${cx},${cy}`); });

// ── 节点 ──
const nodeEls = {}, ng = $('#nodes');
Object.keys(POS).forEach(id => {
  const n = M.byId[id], k = M.kindOf(id), [x, y] = POS[id], g = el('g', { class: 'node k-' + k, transform: `translate(${x},${y})` }, ng);
  if (k === 'trait') {
    const w = n.name.length * 13 + 30;
    el('rect', { x: -w / 2, y: -15, width: w, height: 30, rx: 15, fill: '#fff', filter: 'url(#sh)' }, g);
    el('rect', { x: -w / 2 - 4, y: -19, width: w + 8, height: 38, rx: 19, class: 'hl' }, g);
    el('text', { y: 5, 'text-anchor': 'middle' }, g).textContent = n.name;
  } else if (k === 'emotion') {
    const r = 11 + n.v * 9;
    el('circle', { r, fill: n.color, stroke: '#fff', 'stroke-width': 3, filter: 'url(#sh)' }, g);
    el('circle', { r: r + 6, class: 'hl' }, g);
    el('text', { y: r + 18, 'text-anchor': 'middle' }, g).textContent = n.name + (id === M.mood.now ? ' · 此刻' : '');
  } else {
    const r = 9 + n.str * 5, [lx, ly] = P(r + 10, ANG[id]), right = Math.cos(rad(ANG[id])) >= 0;
    el('circle', { r, fill: '#fff', filter: 'url(#sh)' }, g);
    el('circle', { r: r + 5, class: 'hl' }, g);
    el('text', { y: 4, 'text-anchor': 'middle', class: 'glyph' }, g).textContent = GLYPH[n.type];
    el('text', { x: lx, y: ly + 4, 'text-anchor': Math.abs(Math.cos(rad(ANG[id]))) < .25 ? 'middle' : right ? 'start' : 'end', dy: Math.abs(Math.cos(rad(ANG[id]))) < .25 ? (ly > 0 ? 8 : -4) : 0 }, g).textContent = n.title.length > 9 ? n.title.slice(0, 9) + '…' : n.title;
  }
  g.addEventListener('click', e => { e.stopPropagation(); select(id); });
  nodeEls[id] = g;
});
$('#orbit').addEventListener('click', () => select(null));

// ── 选择 ──
let SEL = null;
function chainOf(id) {
  const k = M.kindOf(id);
  if (k === 'memory') { const m = M.byId[id]; return [m.id, m.emo, m.trait, 'core']; }
  if (k === 'trait') return [id, 'core'];
  return [id];
}
function select(id) {
  SEL = id;
  const svg = $('#orbit'), nb = id ? M.neighbors(id).map(n => n.id) : [], lit = new Set(id ? [id, ...nb, ...chainOf(id)] : []);
  svg.classList.toggle('dim', !!id);
  Object.entries(nodeEls).forEach(([k, g]) => { g.classList.toggle('lit', lit.has(k)); g.classList.toggle('sel', k === id); });
  const ch = id ? chainOf(id) : [];
  EDGES.forEach(e => {
    const direct = id && (e.a === id || e.b === id), onChain = ch.includes(e.a) && ch.includes(e.b) && M.kindOf(e.a) !== 'memory' ? true : false;
    e.path.classList.toggle('lit', !!(direct || (onChain && e.b === 'core')));
    e.path.style.stroke = direct && M.kindOf(e.b) === 'emotion' ? M.byId[e.b].color : '';
  });
  document.querySelectorAll('.ck').forEach(c => c.classList.toggle('sel', c.dataset.id === id || (id && M.kindOf(id) === 'memory' && M.byId[id].trait === c.dataset.id)));
  panel();
}
const nm = id => id === 'core' ? '大肥鱼' : M.kindOf(id) === 'memory' ? M.byId[id].title : M.byId[id].name;
function relRow(r) { return `<div class="rel" data-id="${r.id}"><i style="background:${M.kindOf(r.id) === 'emotion' ? M.byId[r.id].color : '#3f6fe6'}"></i><div><b>${nm(r.id)}</b><small>${r.reason}</small></div><em>${r.rel}</em></div>`; }
function panel() {
  const p = $('#panel');
  if (!SEL) {
    $('#sayText').textContent = M.mood.line;
    p.innerHTML = `<div class="card"><h4 class="mono">TODAY'S MOOD · 今日心情</h4><div class="moods">${M.emotions.map(e => `<div data-id="${e.id}" class="${e.id === M.mood.now ? 'now' : ''}"><i style="background:${e.color}"></i>${e.name}</div>`).join('')}</div></div>
      <div class="card"><h4 class="mono">HOW TO READ · 读图</h4><p class="text">由内向外：<b>人格</b> → <b>情绪</b> → <b>记忆</b>。白线表示记忆塑造了哪种人格，穿过中心的弧线是记忆之间的关联。</p></div>`;
  } else {
    const n = M.byId[SEL], k = M.kindOf(SEL), rel = M.neighbors(SEL);
    $('#sayText').textContent = k === 'memory' ? n.say : M.say[k](n);
    const head = k === 'memory'
      ? `<span class="chip">${M.T[n.type]}记忆</span><div class="title">${n.title}</div><p class="text">${n.text}</p>
         <div class="chain">${chainOf(SEL).map(c => `<span>${nm(c)}</span>`).join('<i>→</i>')}</div>`
      : `<span class="chip" style="${k === 'emotion' ? 'background:' + n.color : ''}">${k === 'trait' ? '人格' : '情绪'} · ${n.en}</span><div class="title">${n.name}</div><p class="text">${k === 'trait' ? rel.length + ' 颗记忆豆塑造了这一面' : rel.length + ' 颗记忆豆带着这种心情'} · 强度 ${Math.round(n.v * 100)}%</p>`;
    p.innerHTML = `<div class="card">${head}</div><div class="card"><h4 class="mono">LINKED · 关联 ${rel.length}</h4>${rel.map(relRow).join('')}</div>`;
  }
  p.querySelectorAll('[data-id]').forEach(r => r.addEventListener('click', () => select(r.dataset.id)));
}
$('#stile').innerHTML = M.traits.map(t => `<div class="ck" data-id="${t.id}"><div class="box">${t.on ? '<svg viewBox="0 0 20 20"><path d="M3 10.5l4.5 4.5L17 4" fill="none" stroke="#fff" stroke-width="2.6"/></svg>' : ''}</div><div><b>${t.name}</b><small>${t.en}</small></div><em>${Math.round(t.v * 100)}</em></div>`).join('');
document.querySelectorAll('.ck').forEach(c => c.addEventListener('click', () => select(c.dataset.id)));
$('#cM').textContent = M.memories.length; $('#cMood').textContent = M.byId[M.mood.now].name;
panel();
if (location.hash) select(location.hash.slice(1));
</script>
</body>
</html>
