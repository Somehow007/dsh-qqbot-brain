<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>D-Admin · 瑞士网格管理端 · 规格稿</title>
<style>
:root{--bg:#f6f5f1;--ink:#0f0f0f;--ink2:#6b6a66;--ink3:#a9a7a0;--rule:#d9d7cf;
 --a:#3d7bff;--a2:#8ec5ff;--soft:#e7f0ff;--deep:#0d2a66;
 --note:#fff6c8;--danger:#b3352b;
 --sans:"Helvetica Neue",Helvetica,"PingFang SC",Arial,sans-serif;
 --mono:"SF Mono",ui-monospace,Menlo,monospace}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 var(--sans);display:flex;overflow:hidden}
button{font-family:var(--sans)}a{color:inherit}
::selection{background:var(--a);color:#fff}
/* ── 左导航 ── */
#nav{width:204px;flex:none;height:100vh;overflow-y:auto;border-right:1px solid var(--ink);display:flex;flex-direction:column;background:var(--bg)}
.nbrand{padding:14px 16px 10px;font:700 11px var(--mono);letter-spacing:.18em;color:var(--ink3)}
.nbrand b{display:block;font:700 15px/1.2 var(--sans);letter-spacing:.02em;color:var(--ink);margin-top:3px}
.np{padding:12px 16px 14px;border-bottom:6px solid var(--ink)}
.np .lb{font:700 10px var(--mono);letter-spacing:.14em;color:var(--ink3);margin-bottom:8px}
.np .who{display:flex;gap:10px;align-items:center;margin-bottom:9px}
.np .sw{width:16px;height:16px;flex:none;border:1px solid var(--ink)}
.np .who b{font-size:14px;display:block;line-height:1.2}
.np .who small{font:10px var(--mono);color:var(--ink3)}
.np select{width:100%;font:12px var(--sans);padding:6px 7px;border:1px solid var(--ink);background:#fff;border-radius:2px}
.nl{flex:1;padding:6px 0 12px}
.nl a{display:flex;gap:10px;align-items:baseline;padding:9px 16px;color:var(--ink3);text-decoration:none;border-left:3px solid transparent;font-size:13px}
.nl a i{font:10px var(--mono);font-style:normal;color:var(--ink3);width:20px}
.nl a:hover{color:var(--ink);background:#efede7}
.nl a.on{color:var(--ink);font-weight:700;border-left-color:var(--a);background:color-mix(in srgb,var(--a) 9%,transparent)}
.nfoot{padding:10px 16px;border-top:1px solid var(--rule);font:10px/1.6 var(--mono);color:var(--ink3)}
/* ── 主区 ── */
#main{flex:1;min-width:0;height:100vh;display:flex;flex-direction:column}
#topbar{display:flex;align-items:center;gap:14px;padding:9px 26px;border-bottom:1px solid var(--ink);background:var(--bg);flex:none}
#topbar .brand{font:700 12px var(--sans);letter-spacing:.1em}
#topbar .brand span{color:var(--deep);font-weight:400}
#topbar .sp{flex:1}
.tgl{display:flex;align-items:center;gap:8px;font:11px var(--mono);color:var(--ink2);cursor:pointer;user-select:none}
.tgl input{accent-color:var(--a)}
#rstat{font:11px var(--mono);color:var(--ink3);white-space:nowrap}
#rstat b{color:var(--ink2);font-weight:400}
#rstat.edit{color:var(--a);font-weight:700}
#view{flex:1;overflow-y:auto;padding:24px 30px 90px}
#viewinner{max-width:1180px;margin:0 auto}
/* ── 模块标题 ── */
.phead{display:flex;align-items:baseline;gap:14px;padding-bottom:12px;border-bottom:6px solid var(--ink);margin-bottom:6px}
.phead .no{font:700 12px var(--mono);letter-spacing:.1em;color:var(--deep)}
.phead h1{margin:0;font:700 30px/1 var(--sans);letter-spacing:-.02em}
.phead .sub{margin-left:auto;font:11px var(--mono);color:var(--ink3);text-align:right;line-height:1.6}
.mod{margin-top:30px}
.mh{display:flex;gap:14px;align-items:baseline;font:700 12px var(--sans);letter-spacing:.05em;padding-top:8px;border-top:1px solid var(--ink);margin-bottom:14px}
.mh .no{font:700 11px var(--mono);color:var(--deep);letter-spacing:.1em}
.mh span{color:var(--ink2);font-weight:400}
.mh em{margin-left:auto;font:normal 11px var(--mono);color:var(--ink3);font-style:normal}
/* ── 开发标注（可折叠） ── */
.devnote{display:none;margin:12px 0;border:1px dashed #b3a05e;background:var(--note);color:#5c4d12;font:11px/1.65 var(--mono);border-radius:2px}
body.notes-on .devnote{display:block}
.devnote .dn-sum{padding:6px 11px;cursor:pointer;user-select:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.devnote .dn-sum:hover{background:rgba(0,0,0,.05)}
.devnote .dn-tgl{display:inline-block;width:13px;color:#a08c2c;transition:transform .12s}
.devnote.open .dn-tgl{transform:rotate(90deg)}
.devnote .dn-need{display:inline-block;margin-left:8px;padding:0 6px;border:1px solid #b3a05e;border-radius:2px;font-weight:700;color:#7a5f00;background:rgba(255,255,255,.55);vertical-align:1px}
.devnote .dn-body{display:none;padding:2px 13px 11px 36px}
.devnote.open .dn-body{display:block}
.devnote b{color:#7a5f00}
.devnote code{background:rgba(0,0,0,.06);padding:0 3px;font-family:var(--mono)}
.devnote .api{color:#2a5db0}
.dnallbtn{display:none}
body.notes-on .dnallbtn{display:inline-block}
/* ── 大数字 ── */
.nums{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--ink)}
.nums>div{padding:16px 22px 12px;border-right:1px solid var(--rule)}
.nums>div:last-child{border-right:0}
.nums b{display:block;font:700 76px/.95 var(--sans);letter-spacing:-.045em}
.nums b small{font-size:30px;letter-spacing:0}
.nums span{display:block;margin-top:8px;font-size:12px;color:var(--ink2);border-top:1px solid var(--rule);padding-top:7px}
.nums span a{color:var(--a);text-decoration:none;border-bottom:1px solid var(--a2)}
/* ── 分布条 ── */
.dist{border-top:1px solid var(--ink)}
.dist .dr{display:grid;grid-template-columns:120px 1fr 52px;gap:16px;align-items:center;padding:9px 0;border-bottom:1px solid var(--rule);font-size:13px}
.dist .dr .lb{color:var(--ink2);font-size:12px}
.dist .b{height:13px;background:repeating-linear-gradient(90deg,var(--rule) 0 1px,transparent 1px 9%);position:relative}
.dist .b i{position:absolute;left:0;top:0;bottom:0;background:var(--ink)}
.dist .b i.self{background:var(--a)}
.dist .b i.a2{background:var(--a2)}
.dist .dr em{font:12px var(--mono);font-style:normal;text-align:right;color:var(--ink2)}
.cols2{display:grid;grid-template-columns:1fr 1fr;gap:36px}
/* ── 列表行 ── */
.rlist{list-style:none;margin:0;padding:0}
.rlist li{display:flex;justify-content:space-between;gap:14px;padding:9px 0;border-bottom:1px solid var(--rule);font-size:13px;cursor:pointer}
.rlist li:hover{color:var(--a)}
.rlist li small{color:var(--ink3);font:11px var(--mono);white-space:nowrap}
.rlist li .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* ── 表格 ── */
table{width:100%;border-collapse:collapse}
th{text-align:left;font:700 11px var(--sans);letter-spacing:.07em;color:var(--ink2);padding:9px 10px 9px 0;border-bottom:2px solid var(--ink);white-space:nowrap}
td{padding:10px 10px 10px 0;border-bottom:1px solid var(--rule);vertical-align:middle;font-size:13px}
td:first-child,th:first-child{padding-left:0}
tr.data:hover td{background:#efede7}
tr.sel td{background:color-mix(in srgb,var(--a) 10%,transparent)}
tr.flash td{animation:flash 1.6s ease-out}
@keyframes flash{0%,40%{background:color-mix(in srgb,var(--a) 22%,transparent)}100%{background:transparent}}
th[data-sk]{cursor:pointer;user-select:none}
th[data-sk] .sh{color:var(--ink3);font-weight:400;margin-left:3px}
th[data-sk].on .sh{color:var(--a);font-weight:700}
td.num,th.num{text-align:right;font:12px var(--mono);white-space:nowrap}
.empty{padding:34px 0!important;text-align:center;color:var(--ink3);font-size:13px}
/* ── 徽标/标签 ── */
.sq{display:inline-block;width:9px;height:9px;margin-right:7px;vertical-align:-1px}
.tag{display:inline-block;font:10px var(--mono);padding:1px 6px;border:1px solid var(--rule);color:var(--ink2);border-radius:2px;margin-left:6px;vertical-align:1px;white-space:nowrap}
.tag.fad{border-color:var(--danger);color:var(--danger)}
.tag.priv{border-color:var(--deep);color:var(--deep)}
.tag.rel{border-color:var(--a);color:var(--a)}
.badge{display:inline-block;font:700 10px var(--sans);letter-spacing:.05em;padding:2px 7px;border:1px solid var(--ink);border-radius:2px;white-space:nowrap}
.badge.self{border-color:var(--a);color:var(--a)}
.badge.world{border-color:var(--ink3);color:var(--ink3)}
.badge.on{background:var(--deep);border-color:var(--deep);color:#fff}
/* ── 保持率条 ── */
.rbar{display:inline-block;width:58px;height:9px;background:repeating-linear-gradient(90deg,var(--rule) 0 1px,transparent 1px 12%);vertical-align:middle;position:relative;margin-right:7px}
.rbar i{position:absolute;left:0;top:0;bottom:0;background:var(--ink)}
tr.fading .rbar i{background:var(--danger)}
.ret{font:11px var(--mono);color:var(--ink2);white-space:nowrap}
/* ── 表单控件 ── */
.btn{font:12px var(--sans);padding:7px 15px;border:1px solid var(--ink);background:var(--bg);color:var(--ink);cursor:pointer;border-radius:2px;letter-spacing:.03em}
.btn:hover{background:var(--ink);color:#fff}
.btn.pri{background:var(--a);border-color:var(--a);color:#fff}
.btn.pri:hover{background:var(--deep);border-color:var(--deep)}
.btn.a2{border-color:var(--a2);color:var(--a2)}
.btn.a2:hover{background:var(--a2);color:var(--ink)}
.btn.danger{border-color:var(--danger);color:var(--danger)}
.btn.danger:hover{background:var(--danger);color:#fff}
.btn.ghost{border-color:var(--rule);color:var(--ink2)}
.btn.ghost:hover{background:#efede7;color:var(--ink);border-color:var(--ink2)}
.btn.sm{padding:3px 9px;font-size:11px}
.btn:disabled{opacity:.38;cursor:default}
.btn:disabled:hover{background:var(--bg);color:var(--ink);border-color:var(--ink)}
.btn.pri:disabled:hover{background:var(--a);color:#fff;border-color:var(--a)}
.act{font:11px var(--sans);padding:2px 8px;margin-right:4px;border:1px solid var(--rule);background:var(--bg);color:var(--ink2);cursor:pointer;border-radius:2px}
.act:hover{border-color:var(--ink);color:var(--ink)}
.act.re{border-color:var(--a2);color:var(--a2)}
.act.re:hover{background:var(--a2);color:#fff}
.act.del{border-color:var(--danger);color:var(--danger)}
.act.del:hover{background:var(--danger);color:#fff}
.act.rel{border-color:var(--deep);color:var(--deep)}
.act.rel:hover{background:var(--deep);color:#fff}
input,select,textarea{font:13px var(--sans);padding:7px 9px;border:1px solid var(--ink2);background:#fff;color:var(--ink);border-radius:2px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--a);outline-offset:-1px;border-color:var(--a)}
input[type=checkbox]{accent-color:var(--a);width:14px;height:14px}
input[type=color]{width:34px;height:26px;padding:2px;border:1px solid var(--ink2);background:#fff;cursor:pointer;border-radius:2px}
input[type=range]{accent-color:var(--a);width:110px}
.fld{display:flex;flex-direction:column;gap:5px;margin-bottom:13px}
.fld>label{font:700 10px var(--mono);letter-spacing:.1em;color:var(--ink3)}
.fld .hint{font:10px var(--mono);color:var(--ink3)}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:14px}
/* ── 工具栏 ── */
.toolbar{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:flex-end;padding:12px 0;border-top:1px solid var(--ink);border-bottom:1px solid var(--rule);margin-bottom:0}
.toolbar .fld{margin:0;min-width:0}
.toolbar label{font:10px var(--mono);color:var(--ink3);letter-spacing:.06em;display:block;margin-bottom:4px}
.toolbar input[type=search],.toolbar input.q{width:190px}
.toolbar select{font-size:12px;padding:6px 7px}
/* ── 分页 ── */
.pagerbar{display:flex;align-items:center;gap:5px;margin-top:16px;flex-wrap:wrap}
.pagerbar button{min-width:30px;height:29px;padding:0 8px;border:1px solid var(--rule);background:var(--bg);color:var(--ink);font:12px var(--sans);cursor:pointer;border-radius:2px}
.pagerbar button:hover:not(:disabled){border-color:var(--ink)}
.pagerbar button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.pagerbar button:disabled{opacity:.35;cursor:default}
.pagerbar .cnt{margin-left:auto;font:11px var(--mono);color:var(--ink3);white-space:nowrap}
/* ── 批量条 ── */
#batchbar{position:fixed;left:204px;right:0;bottom:0;z-index:30;display:none;align-items:center;gap:14px;background:var(--ink);color:#fff;padding:10px 26px;font-size:13px}
#batchbar.on{display:flex}
#batchbar b{color:var(--a2)}
#batchbar select{font-size:12px;padding:5px 7px}
#batchbar .sp{flex:1}
/* ── 抽屉 ── */
#scrim{position:fixed;inset:0;background:rgba(15,15,15,.16);opacity:0;pointer-events:none;transition:opacity .18s;z-index:44}
#scrim.on{opacity:1;pointer-events:auto}
#drawer{position:fixed;top:0;right:0;bottom:0;width:460px;max-width:94vw;background:var(--bg);border-left:1px solid var(--ink);transform:translateX(102%);transition:transform .2s;z-index:45;display:flex;flex-direction:column}
#drawer.on{transform:none}
.dhead{display:flex;align-items:center;gap:12px;padding:14px 20px;border-bottom:6px solid var(--ink);flex:none}
.dhead h2{margin:0;font:700 17px var(--sans)}
.dhead .x{margin-left:auto;border:none;background:none;font-size:20px;color:var(--ink3);cursor:pointer;line-height:1}
.dhead .x:hover{color:var(--ink)}
#dbody{flex:1;overflow-y:auto;padding:18px 20px 30px}
.dfoot{display:flex;gap:10px;padding:13px 20px;border-top:1px solid var(--ink);flex:none}
.dfoot .sp{flex:1}
.counter{font:10px var(--mono);color:var(--ink3);text-align:right}
.counter.over{color:var(--danger);font-weight:700}
/* ── 弹窗 ── */
#modalroot .mbox{position:fixed;inset:0;background:rgba(15,15,15,.28);display:flex;align-items:center;justify-content:center;z-index:55;padding:20px}
.mcard{background:var(--bg);border:2px solid var(--ink);padding:22px 26px;width:460px;max-width:100%;max-height:86vh;overflow-y:auto}
.mcard h3{margin:0 0 10px;font:700 16px var(--sans)}
.mcard .mb{font-size:13px;color:var(--ink2);line-height:1.7;margin-bottom:14px;white-space:pre-wrap}
.mcard .mf{display:flex;gap:10px;justify-content:flex-end;margin-top:8px}
.mcard input[type=text]{width:100%;margin:6px 0 4px}
/* ── toast ── */
#toasts{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:70;display:flex;flex-direction:column;gap:8px;align-items:center}
.toast{background:var(--ink);color:#fff;padding:9px 20px;font-size:13px;border-left:4px solid var(--a);max-width:80vw}
.toast.err{border-left-color:var(--danger)}
.toast.ok{border-left-color:#7dbb5a}
/* ── 人设页 ── */
.pgrid{display:grid;grid-template-columns:236px 1fr;border-top:1px solid var(--ink)}
.plist{border-right:1px solid var(--rule);min-height:420px}
.plist .pi{display:flex;gap:11px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--rule);cursor:pointer}
.plist .pi:hover{background:#efede7}
.plist .pi.on{background:color-mix(in srgb,var(--a) 9%,transparent);box-shadow:inset 3px 0 0 var(--a)}
.plist .pi .sw{width:14px;height:14px;flex:none}
.plist .pi b{display:block;font-size:13px}
.plist .pi small{font:10px var(--mono);color:var(--ink3);display:block;margin-top:2px}
.plist .pi .tag{margin-left:auto}
.pnew{padding:12px 16px;border-top:1px solid var(--ink)}
.pedit{padding:20px 26px;min-width:0}
.pedit .sec{margin-bottom:22px}
.pedit .sec>h4{margin:0 0 10px;font:700 11px var(--mono);letter-spacing:.12em;color:var(--deep);border-bottom:1px solid var(--rule);padding-bottom:6px}
.pedit .pstat{font:11px var(--mono);color:var(--ink3);margin-left:auto}
.palrow{display:flex;gap:18px;flex-wrap:wrap}
.palrow .pf{display:flex;flex-direction:column;gap:5px;align-items:flex-start}
.palrow .pf label{font:10px var(--mono);color:var(--ink3)}
.palrow .pf .hx{font:10px var(--mono);color:var(--ink2)}
.chips{display:flex;flex-wrap:wrap;gap:7px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--ink2);border-radius:2px;padding:4px 9px;font-size:12px;background:#fff}
.chip i{width:10px;height:10px;flex:none;cursor:pointer;border:1px solid rgba(0,0,0,.15)}
.chip button{border:none;background:none;color:var(--ink3);cursor:pointer;font-size:13px;padding:0;line-height:1}
.chip button:hover{color:var(--danger)}
.traits .tr{display:grid;grid-template-columns:130px 1fr 44px 26px;gap:12px;align-items:center;padding:7px 0;border-bottom:1px solid var(--rule)}
.traits .tr input[type=text]{padding:5px 8px;font-size:12px}
.traits .tr .vv{font:11px var(--mono);color:var(--ink2);text-align:right}
.traits .tr .xx{border:none;background:none;color:var(--ink3);cursor:pointer;font-size:14px}
.traits .tr .xx:hover{color:var(--danger)}
.monoed{display:grid;grid-template-columns:38px 1fr;border:1px solid var(--ink2);background:#fff}
.monoed .ln{font:11px/20.4px var(--mono);color:var(--ink3);text-align:right;padding:10px 8px 10px 0;border-right:1px solid var(--rule);user-select:none;overflow:hidden;white-space:pre}
.monoed textarea{border:none;outline:none;resize:vertical;min-height:340px;font:12px/1.7 var(--mono);padding:10px 12px;color:var(--ink);background:transparent}
.pbtns{display:flex;gap:10px;flex-wrap:wrap;margin-top:4px}
.pdirty{font:11px var(--mono);color:var(--a);font-weight:700}
/* ── 画像页 ── */
.pcards{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--ink)}
.pcard{border-right:1px solid var(--rule);border-bottom:1px solid var(--rule);padding:16px 18px;display:flex;flex-direction:column;gap:9px;min-height:230px}
.pcard:nth-child(3n){border-right:0}
.pcard .ph{display:flex;align-items:baseline;gap:8px}
.pcard .ph b{font-size:14px}
.pcard .ph small{font:10px var(--mono);color:var(--ink3);margin-left:auto;text-align:right;line-height:1.5}
.pcard .pk{font:10px var(--mono);color:var(--ink3)}
.pcard .pt{flex:1;font-size:12px;line-height:1.65;color:var(--ink2);overflow:hidden;white-space:pre-wrap}
.pcard .pt mark{background:color-mix(in srgb,var(--a) 25%,transparent);color:var(--ink);padding:0 1px}
.pcard .ps{display:flex;flex-wrap:wrap;gap:4px}
.pcard .ps span{font:9px var(--mono);border:1px solid var(--rule);color:var(--ink3);padding:1px 5px;border-radius:2px}
.pcard .pa{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto}
.pcard.editing{background:color-mix(in srgb,var(--soft) 45%,transparent)}
.pcard textarea{width:100%;min-height:110px;font-size:12px;line-height:1.6;resize:vertical}
.pcard input.pn{font-size:12px;padding:5px 8px}
.mergebanner{display:flex;align-items:center;gap:12px;background:color-mix(in srgb,var(--a) 12%,transparent);border:1px solid var(--a);padding:10px 16px;font-size:13px;margin-bottom:14px}
.mergebanner button{margin-left:auto}
/* ── 流水页 ── */
.opsfilter{display:flex;gap:14px;align-items:flex-end;flex-wrap:wrap;padding:12px 0;border-top:1px solid var(--ink);border-bottom:1px solid var(--rule)}
tr.oprow{cursor:pointer}
tr.oprow:hover td{background:#efede7}
tr.opdet>td{background:#efede7;padding:12px 18px}
tr.opdet pre{margin:0;font:11px/1.7 var(--mono);color:var(--ink2);white-space:pre-wrap;word-break:break-all;max-height:260px;overflow:auto}
.et{display:inline-block;font:700 10px var(--sans);letter-spacing:.06em;padding:2px 8px;border:1px solid var(--ink2);border-radius:2px;white-space:nowrap}
.et.recall{border-color:var(--a);color:var(--a)}
.et.distill{border-color:var(--ink);color:var(--ink)}
.et.mood{border-color:var(--a2);color:#3d6ea8}
.et.consolidate{border-color:var(--deep);color:var(--deep)}
.et.decay{border-color:var(--ink3);color:var(--ink3)}
.et.import{border-color:#7dbb5a;color:#4c7a2e}
.et.edit{border-color:var(--danger);color:var(--danger)}

  else if(e==='edit')raw={op:'update',id:n.id,patch:pick([{content:'（修改内容）'},{importance:ri(1,5)},{kind:pick(['episodic','semantic','attitude'])},{private:'public'},{self:true}])};
  else if(e==='mood')raw={op:'emotion',sessionId:sess,state:{v:+(R()*1.4-.7).toFixed(2),a:+R().toFixed(2),d:+(R()*1.4-.7).toFixed(2),label:pick(['平静','开心','认真','安心','委屈','害羞']),mood:pick(EMO_BY_CHAR[n.characterId]||EMO_BY_CHAR.whale),personaId:pid}};
  else if(e==='consolidate')raw=R()<.5?{op:'absorb',ids:[n.id,pick(notes).id],at:t}:{op:'merge',keepId:n.id,dropId:pick(notes).id,patch:{strength:n.strength,hits:n.hits+2,importance:n.importance,createdAt:n.createdAt,lastAccessAt:t}};
  else if(e==='decay')raw={op:'(derived)',report:'retention-snapshot',fading:ri(2,9),threshold:.2,at:t};
  else raw={op:'import',mode:pick(['merge','replace']),notes:ri(3,40),skipped:ri(0,8),profiles:ri(0,4),persona:R()<.5};
  const actor=e==='edit'||e==='import'?'管理员':(e==='mood'||e==='decay'?'系统':(p?p.name:'系统'));
  ops.push({t:Math.round(t),etype:e,noteId:['recall','distill','edit','consolidate'].includes(e)?n.id:undefined,actor,raw});

function opSummary(o){

 switch(o.etype){
  case'recall':return`唤起「${c}」→ 注入召回（S→${r.strength} · hits ${r.hits}）`;
  case'distill':return`蒸馏产出「${c}」· ${K[r.note?.kind]||''}`;
  case'edit':{
   if(r.op==='del-range')return`按时段删除 ${r.ids.length} 条（${fmtT(r.from)} ~ ${fmtT(r.to)}）`;
   if(r.op==='del-persona')return`按人设删除 ${r.personaId}（${r.ids.length} 条）`;
   if(r.op==='reset')return r.keepPersona?'记忆重置（人设保留）':'整库重置（导入覆盖）';
   if(r.op==='del')return`删除记忆 #${shortId(r.id||o.noteId)}`;
   if(r.op==='profile-merge')return`画像合并 ${shortId(r.keep)} ← ${shortId(r.drop)}`;
   if(r.op==='profile')return`画像 ${shortId(r.key)} 更新`;

   return`修改记忆 ${shortId(o.noteId)} · ${JSON.stringify(r.patch||{}).slice(0,50)}`;
  }
  case'mood':return`情绪 → ${r.state.mood||r.state.label}（v=${r.state.v} a=${r.state.a}）· ${sessById[r.sessionId]?.label||shortId(r.sessionId)}`;
  case'consolidate':{
   if(r.op==='consolidate')return`手动巩固：${r.sessions} 会话 → ${r.semanticNotes} 条语义`;
   return r.op==='absorb'?`巩固吸收 ${r.ids.length} 条情景源`:`近重复合并：保留 ${shortId(r.keepId)} 吸收 ${shortId(r.dropId)}`;

 }return'';
}

function pager(total,page,size,go2){
 const pages=Math.max(1,Math.ceil(total/size)),cur=Math.min(Math.max(1,page),pages);
 const from=total?((cur-1)*size+1):0,to=Math.min(total,cur*size);
 const nums=[];const win=new Set([1,pages,cur-1,cur,cur+1]);
 for(let i=1;i<=pages;i++)if(win.has(i)&&i>=1&&i<=pages)nums.push(i);
 nums.sort((a,b)=>a-b);
 let html=`<button ${cur<=1?'disabled':''} data-pg="1">首页</button><button ${cur<=1?'disabled':''} data-pg="${cur-1}">上一页</button>`;
 let prev=0;
 for(const n of nums){if(n-prev>1)html+=`<button disabled>…</button>`;html+=`<button class="${n===cur?'on':''}" data-pg="${n}">${n}</button>`;prev=n}
 html+=`<button ${cur>=pages?'disabled':''} data-pg="${cur+1}">下一页</button><button ${cur>=pages?'disabled':''} data-pg="${pages}">末页</button>`;
 return `<div class="pagerbar">${html}<span class="cnt">第 ${from}–${to} 条，共 ${total} 条</span></div>`;

async function saveNote(){
 const d=DRAFT,c=(d.content||'').trim();
 if(!c){toast('content 不能为空','err');$('#d-content').focus();return}
 const imp=Math.min(5,Math.max(1,Math.round(d.importance||3)));
 const kind=['episodic','semantic','attitude'].includes(d.kind)?d.kind:'episodic';
 const self=kind==='attitude'?undefined:(d.self===true?true:d.self===false?false:undefined);
 const sess=d.sessionId||'manual';
 const priv=d.scopeSel===''||d.scopeSel===undefined?undefined:(d.scopeSel==='__sess__'?sess:d.scopeSel);
 if(d.id){
  const n=noteById(d.id);if(!n)return;
  n.content=c.slice(0,200);n.importance=imp;n.kind=kind;n.sessionId=sess;n.actor=d.actor||undefined;
  n.self=self;n.private=priv;n.scope=priv??(sessById[sess]?.domain||undefined);
  n.track=isSelfTrack(n)?'self':'world';n.characterId=DB.personas.find(p=>p.id===n.personaId)?.characterId||n.characterId;
  if(self===true||kind==='attitude')n.characterId=d.characterId||n.characterId;
  toast('已保存（PATCH /api/notes/'+d.id+'）','ok');
 }else{
  const pid=(self||kind==='attitude')?(DB.personas.find(p=>p.characterId===d.characterId)?.id||DB.activeId):DB.activeId;
  const p=DB.personas.find(x=>x.id===pid);
  const id='m'+String(DB.notes.length+1000+ri(0,999)).padStart(4,'0');
  const strength=imp*(1+R());
  const n={id,content:c.slice(0,200),kind,sessionId:sess,actor:d.actor||undefined,importance:imp,personaId:pid,
   self,private:priv,createdAt:NOW,strength:+strength.toFixed(2),lastAccessAt:NOW,hits:0,retention:1,fading:false,ageDays:0,
   emotion:{v:0,a:0,d:0,label:'平静',mood:pick(EMO_BY_CHAR[p.characterId]||EMO_BY_CHAR.whale),personaId:pid},
   characterId:p.characterId,scope:priv??(sessById[sess]?.domain||undefined),track:'world'};
  n.track=isSelfTrack(n)?'self':'world';
  DB.notes.unshift(n);
  DB.ops.unshift({t:Date.now(),etype:'distill',noteId:id,actor:'管理员',raw:{op:'add',note:{id,content:c.slice(0,42),kind,importance:imp,sessionId:sess}}});
  toast('已写入（POST /api/notes）','ok');
 }
 DRAFT=null;$('#drawer').classList.remove('on');$('#scrim').classList.remove('on');
 render();
}

function rProfiles(){
 const all=DB.profiles,ps=P.profiles,size=ps.size,page=Math.min(ps.page,Math.max(1,Math.ceil(all.length/size)));
 const rows=all.slice((page-1)*size,page*size);

 const editing=P.profiles.editing;
 return `<div class="phead"><span class="no">04</span><h1>画像</h1><div class="sub">Profiles<br>按人（u:）+ 会话级（sess:）画像卡</div></div>

 <div class="pcards">${rows.length?rows.map(p=>{

   :`<div class="pt">${esc(p.text).replace(/〔私〕[^。\n]*(?:。|\n|$)/g,m=>'<mark>'+m+'</mark>')}</div>`;
  const meta=`<div class="ps">${(p.sessions||[]).slice(0,4).map(s=>`<span>${esc(sessById[s]?.label||s)}</span>`).join('')}${(p.sessions||[]).length>4?`<span>+${p.sessions.length-4}</span>`:''}</div><div class="pk">${esc(p.key)} · 更新 ${fmtT(p.updatedAt)}</div>`;
  const acts=isEdit
   ?`<button class="act" onclick="profSave('${esc(p.key)}')">保存</button><button class="act" onclick="P.profiles.editing=null;render()">取消</button>`
   :`<button class="act" onclick="P.profiles.editing='${esc(p.key)}';render()">编辑</button><button class="act" onclick="profRegen('${esc(p.key)}')">重生成</button><button class="act del" onclick="profDel('${esc(p.key)}')">删除</button>${canMerge?(merging?'<button class="act" disabled>合并中…</button>':(mergeKeep&&mergeKeep.key!==p.key?`<button class="act rel" onclick="profMergeInto('${esc(p.key)}')">并入「${esc(mergeKeep.name)}」</button>`:`<button class="act" onclick="P.profiles.merge='${esc(p.key)}';render()">合并…</button>`)):'<span class="tag" style="margin-left:auto">会话卡不可合并</span>'}`;
  return `<div class="pcard ${isEdit?'editing':''}"><div class="ph"><span class="badge ${p.kind==='person'?'self':'world'}">${p.kind==='person'?'人物':'会话'}</span><b>${esc(p.name||'(未命名)')}</b><small>${privSeg?'含 '+privSeg+' 私域句':''}</small></div><div class="pk">${esc(p.key)}</div>${body}${meta}<div class="pa">${acts}</div></div>`;
 }).join(''):'<div class="empty" style="grid-column:1/-1;padding:36px 0">暂无画像 —— 由蒸馏/合并自动产出</div>'}</div>
 ${pager(all.length,page,size,p=>{P.profiles.page=p;render()})}
 ${DN(`<b>GET /api/profiles</b> → <code class="api">{profiles:[{key,kind:'person'|'session',name,openid?,text,sessions[],updatedAt}]}</code>，key=<code>u:&lt;openid&gt;</code>|<code>sess:&lt;sessionId&gt;</code>，person 在前 session 在后按 updatedAt 倒序。编辑 <code class="api">PATCH /api/profiles {key*,name?,text*}</code>（text≤500 PROFILE_TEXT_CAP，人工修改即盖 reviewed章）；删除 <code class="api">DELETE /api/profiles?id=&lt;key&gt;</code>（空文本 op）；重生成 <code class="api">POST /api/profiles/regenerate {key}</code>（蒸馏+审核 LLM，失败/无稳定内容不改数据，409+reason）；合并 <code class="api">POST /api/profiles/merge {keep,drop}</code>（仅 u: 键，审核模型合并文本+吸收会话，409=失败）。分页为前端本地，<b>需后端新增</b>分页参数。`)}

async function profSave(key){const ta=document.getElementById('pt-'+key),nm=document.getElementById('pn-'+key);if(!ta)return;const p=DB.profiles.find(x=>x.key===key);if(!p)return;const text=ta.value.trim();if(!text){toast('画像文本不能为空','err');return}p.text=text.slice(0,500);p.name=(nm?.value||'').trim();p.updatedAt=Date.now();P.profiles.editing=null;toast('已保存（PATCH /api/profiles）','ok');render()}
async function profDel(key){const p=DB.profiles.find(x=>x.key===key);if(!p)return;if(!await askConfirm({title:'删除画像',body:`删除「${esc(p.name)}」的画像卡？<br><span style="font:11px var(--mono)">${esc(key)}</span>`,okText:'删除',danger:true}))return;DB.profiles=DB.profiles.filter(x=>x.key!==key);DB.ops.unshift({t:Date.now(),etype:'edit',actor:'管理员',raw:{op:'profile',key,text:''}});toast('已删除','ok');render()}
async function profRegen(key){const p=DB.profiles.find(x=>x.key===key);if(!p)return;
 // 模拟：蒸馏+审核需 LLM，mock 用句子重排演示
 const btns=$$('.pcard .pa .act');btns.forEach(b=>b.disabled=true);
 toast('重生成中（蒸馏起草 → 审核把关）…');
 await new Promise(r=>setTimeout(r,1100));
 const sents=p.text.split(/(?<=[。！？\n])/).filter(Boolean);
 if(sents.length>2){const first=sents.shift();sents.push(first);p.text=sents.join('').slice(0,500)}
 p.updatedAt=Date.now();P.profiles.editing=null;
 toast('已重新生成（POST /api/profiles/regenerate）','ok');render()}
async function profMergeInto(dropKey){const keepKey=P.profiles.merge;if(!keepKey||keepKey===dropKey)return;const keep=DB.profiles.find(p=>p.key===keepKey),drop=DB.profiles.find(p=>p.key===dropKey);if(!keep||!drop)return;
 if(!await askConfirm({title:'合并画像',body:`把「${esc(drop.name)}」并入「${esc(keep.name)}」？<br>审核模型将合并文本、吸收会话标记，drop 卡删除（POST /api/profiles/merge）。`,okText:'合并'}))return;
 const seen=new Set(),merged=[];
 for(const s of(keep.text+'。'+drop.text).split(/(?<=[。！？\n])/)){const t=s.trim();if(t&&!seen.has(t)){seen.add(t);merged.push(t)}}
 keep.text=merged.join('').slice(0,500);keep.sessions=[...new Set([...(keep.sessions||[]),...(drop.sessions||[])])];keep.updatedAt=Date.now();
 DB.profiles=DB.profiles.filter(p=>p.key!==dropKey);P.profiles.merge=null;
 DB.ops.unshift({t:Date.now(),etype:'edit',actor:'管理员',raw:{op:'profile-merge',keep:keepKey,drop:dropKey}});
 toast('已合并（keep='+shortId(keepKey)+'）','ok');render()}

const GF={kind:'',track:'',sel:null};
const LINK_CN={derived:'沉淀来源',semantic:'语义相似',session:'同会话'};
function graphNodes(){
 const ORDER={attitude:0,semantic:1,episodic:2};
 const all=DB.notes.filter(n=>(!GF.kind||n.kind===GF.kind)&&(!GF.track||(GF.track==='self')===isSelfTrack(n)));
 const total=all.length;
 if(total<=40){
  const ns=all.sort((a,b)=>ORDER[a.kind]-ORDER[b.kind]||b.importance-a.importance||b.retention-a.retention);
  return{ns,trunc:false,total};
 }
 // 截断：按 重要度×2+保持率×3+唤起×0.05 打分；三类按比例分配名额且每类保底
 const CAP=40,score=n=>n.importance*2+n.retention*3+n.hits*0.05;
 const groups={episodic:[],semantic:[],attitude:[]};
 all.forEach(n=>groups[n.kind].push(n));
 const ks=Object.keys(groups).filter(k=>groups[k].length);
 ks.forEach(k=>groups[k].sort((a,b)=>score(b)-score(a)||b.createdAt-a.createdAt));
 const alloc={};ks.forEach(k=>alloc[k]=0);
 const floorN=Math.min(6,Math.floor(CAP/ks.length));
 const totLen=ks.reduce((s,k)=>s+groups[k].length,0);
 // 按组大小比例分配，且每类保底 floorN
 ks.forEach(k=>alloc[k]=Math.max(Math.min(groups[k].length,floorN),Math.round(CAP*groups[k].length/totLen)));
 let sum=ks.reduce((s,k)=>s+alloc[k],0);
 const minAlloc=k=>Math.min(groups[k].length,floorN);
 while(sum>CAP){const k=ks.filter(k=>alloc[k]>minAlloc(k)).sort((a,b)=>(alloc[b]/groups[b].length)-(alloc[a]/groups[a].length))[0];if(!k)break;alloc[k]--;sum--}
 while(sum<CAP){const k=ks.filter(k=>alloc[k]<groups[k].length).sort((a,b)=>(alloc[a]/groups[a].length)-(alloc[b]/groups[b].length))[0];if(!k)break;alloc[k]++;sum++}
 const ns=ks.flatMap(k=>groups[k].slice(0,alloc[k]))
  .sort((a,b)=>ORDER[a.kind]-ORDER[b.kind]||score(b)-score(a));
 return{ns,trunc:true,total};
}
function drawArc(){
 const svg=$('#arc');if(!svg)return;const NS='http://www.w3.org/2000/svg';
 const{ns,trunc,total}=graphNodes();
 svg.setAttribute('viewBox','0 0 900 500');svg.innerHTML='';
 const el=(t,a={},p)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);p&&p.appendChild(e);return e};
 if(!ns.length){const t=el('text',{x:30,y:230,'font-size':14,fill:'#a9a7a0'},svg);t.textContent='当前筛选下没有可绘制的记忆';return}
 const BASE=250,x0=34,gapG=42,step=(900-x0*2-gapG*2)/Math.max(1,ns.length-1);
 const X={};let x=x0,prev=null;const groups={};
 ns.forEach(m=>{if(prev&&prev!==m.kind)x+=gapG;X[m.id]=x;(groups[m.kind]??=[]).push(x);prev=m.kind;x+=step});
 for(const[k,xs]of Object.entries(groups)){
  const a=xs[0]-9,b=xs[xs.length-1]+9;
  el('rect',{x:a,y:BASE-2,width:b-a,height:4,fill:'#0f0f0f'},svg);
  const t=el('text',{x:a,y:18,'font-size':12,'font-weight':700},svg);t.textContent=K[k];
  const t2=el('text',{x:a+30,y:18,'font-size':10,fill:'#a9a7a0'},svg);t2.textContent=`${k.toUpperCase()} · ${xs.length}`;
  el('line',{x1:a,x2:b,y1:26,y2:26,stroke:'#d9d7cf'},svg);
 }
 const ga=el('g',{},svg),vis=new Set(ns.map(n=>n.id));
 for(const l of DB.links){
  if(!vis.has(l.a)||!vis.has(l.b))continue;
  const xa=X[l.a],xb=X[l.b],r=Math.abs(xb-xa)/2,[p,q]=xa<xb?[xa,xb]:[xb,xa];
  el('path',{class:'arc','data-a':l.a,'data-b':l.b,d:`M${p} ${BASE-6} A${r} ${Math.min(r*.8,180)} 0 0 1 ${q} ${BASE-6}`,stroke:l.kind==='derived'?'var(--a)':l.kind==='semantic'?'#0f0f0f':'#a9a7a0','stroke-width':l.kind==='derived'?2:1,'stroke-dasharray':l.kind==='session'?'3 3':''},ga);
 }
 for(const m of ns){
  const nx=X[m.id],self=isSelfTrack(m),col=self?charColor(noteChar(m)):'#0f0f0f',h=8+m.retention*80;
  const g=el('g',{class:'node','data-id':m.id},svg);
  el('rect',{x:nx-step/2,y:30,width:step,height:445,fill:'transparent'},g);
  el('rect',{x:nx-5,y:BASE-11,width:10,height:10,fill:col},g);
  el('rect',{x:nx-3,y:BASE+8,width:6,height:h,fill:m.fading?'none':col,stroke:col,'stroke-width':m.fading?1:0},g);
  const t=el('text',{x:nx,y:BASE+h+24,'font-size':12,'font-weight':m.importance>=4?700:400,fill:m.id===GF.sel?'var(--a)':'#0f0f0f',style:'writing-mode:vertical-rl;letter-spacing:.05em'},g);
  t.textContent=m.content.length>8?m.content.slice(0,8)+'…':m.content;
  const ti=el('title',{},t);ti.textContent=m.content;
  const nn=el('text',{x:nx,y:BASE+h+15,'font-size':9,fill:'#a9a7a0','text-anchor':'middle','font-family':'SF Mono,monospace'},g);nn.textContent=Math.round(m.retention*100);
  g.addEventListener('click',()=>{GF.sel=GF.sel===m.id?null:m.id;drawArc();gside()});
 }
 if(GF.sel){
  const near=new Set([GF.sel,...DB.links.filter(l=>l.a===GF.sel||l.b===GF.sel).map(l=>l.a===GF.sel?l.b:l.a)]);
  svg.querySelectorAll('.node').forEach(g=>g.classList.toggle('dim',!near.has(g.dataset.id)));
  svg.querySelectorAll('.arc').forEach(a=>a.classList.toggle('dim',a.dataset.a!==GF.sel&&a.dataset.b!==GF.sel));
 }
 $('#graphHint').textContent=trunc?`共 ${total} 条符合筛选，按重要度/保持率截断前 40 条绘制（三类均衡取样，每类保底）`:`${total} 条记忆 · ${DB.links.filter(l=>vis.has(l.a)&&vis.has(l.b)).length} 条关联`;
}

   self,private:typeof rn.private==='string'?rn.private:undefined,createdAt:created,strength:+strength.toFixed(2),lastAccessAt:lastAccess,
   hits:Math.max(0,rn.hits|0),retention:+ret.toFixed(3),fading:ret<.2,ageDays:Math.floor((NOW-created)/DAY),

 }

 }
 if(bpers.length){

 DB.profiles.sort((a,b)=>b.updatedAt-a.updatedAt);

/* ── 备份页：近重复 / 危险区 ── */
let DEDUP_EST=null;
function bigrams(s){s=s.replace(/[\s，。！？、；：""''（）()\-—…·,.!?;:'"]/g,'');const o=new Set();for(let i=0;i<s.length-1;i++)o.add(s.slice(i,i+2));return o}
function sim(a,b){const A=bigrams(a),B=bigrams(b);if(!A.size||!B.size)return 0;let n=0;for(const x of A)if(B.has(x))n++;return 2*n/(A.size+B.size)}
function dedupEstimate(){
 const notes=DB.notes.filter(n=>!n.absorbedAt);
 const parent={};const find=x=>{while(parent[x]!==x){parent[x]=parent[parent[x]];x=parent[x]}return x};
 notes.forEach(n=>parent[n.id]=n.id);
 for(let i=0;i<notes.length;i++)for(let j=i+1;j<notes.length;j++){
  const a=notes[i],b=notes[j];
  if(a.track!==b.track)continue;
  if(sim(a.content,b.content)>=.72){const ra=find(a.id),rb=find(b.id);if(ra!==rb)parent[ra]=rb}
 }
 const cl={};notes.forEach(n=>{const r=find(n.id);(cl[r]??=[]).push(n)});
 const clusters=Object.values(cl).filter(c=>c.length>1);
 const merged=clusters.reduce((s,c)=>s+c.length-1,0);
 DEDUP_EST={clusters,pairs:clusters.flatMap(c=>c.slice(1).map(d=>({keep:c[0].id,drop:d.id})))};
 const st=$('#dedupStat');if(st){st.textContent=merged?`预计 ${clusters.length} 簇 · 合并 ${merged} 条重复（保留每簇最长文案）`:'未发现近重复（相似度≥0.72）';st.className='bstat'}
 $('#dedupGo').disabled=!merged}
async function dedupGo(){
 if(!DEDUP_EST)return;
 if(!await askConfirm({title:'合并近重复记忆',body:`将 ${DEDUP_EST.pairs.length} 条近重复并入保留者（hits 求和、importance 取大、strength=max+min×0.5 封顶10），写入 merge op。建议先导出备份。`,okText:'执行合并',danger:true}))return;
 let done=0;
 for(const pr of DEDUP_EST.pairs){
  const keep=noteById(pr.keep),drop=noteById(pr.drop);if(!keep||!drop)continue;
  keep.hits+=drop.hits;keep.importance=Math.max(keep.importance,drop.importance);
  keep.strength=Math.min(10,Math.max(keep.strength,drop.strength)+Math.min(keep.strength,drop.strength)*.5);
  keep.lastAccessAt=Math.max(keep.lastAccessAt,drop.lastAccessAt);keep.createdAt=Math.min(keep.createdAt,drop.createdAt);
  const i=DB.notes.indexOf(drop);if(i>=0)DB.notes.splice(i,1);
  DB.ops.unshift({t:Date.now(),etype:'consolidate',noteId:keep.id,actor:'管理员',raw:{op:'merge',keepId:keep.id,dropId:drop.id,patch:{strength:+keep.strength.toFixed(1),hits:keep.hits}}});
  done++;
 }
 DEDUP_EST=null;$('#dedupGo').disabled=true;const st=$('#dedupStat');if(st){st.textContent=`已合并 ${done} 条`;st.className='bstat ok'}
 toast(`已合并 ${done} 条近重复`,'ok');render()}
function purgeRange(){const f=$('#pf').value?new Date($('#pf').value).getTime():NaN;const t=$('#pt').value?new Date($('#pt').value).getTime()+59999:NaN;if(!isFinite(f)||!isFinite(t)||f>t)return null;return{from:f,to:t,count:DB.notes.filter(n=>n.createdAt>=f&&n.createdAt<=t).length}}
function purgePreview(){const r=purgeRange();const b=$('#purgeGo'),s=$('#purgeStat');if(!r){b.disabled=true;s.textContent='请先选择有效起止时间';return}b.disabled=!r.count;s.textContent=r.count?`区间内 ${r.count} 条记忆将被删除`:'区间内无记忆'}
