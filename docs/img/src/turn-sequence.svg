<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="ar" markerWidth="11" markerHeight="11" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#3B82F6"/>
    </marker>
    <marker id="arA" markerWidth="11" markerHeight="11" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#D97706"/>
    </marker>
    <marker id="arGr" markerWidth="11" markerHeight="11" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#94A3B8"/>
    </marker>
    <style>
      .box{fill:#EFF6FF;stroke:#3B82F6;stroke-width:1.6}
      .boxA{fill:#FFFBEB;stroke:#D97706;stroke-width:1.6}
      .t{font-size:16px;font-weight:700;fill:#1E3A5F}
      .s{font-size:12.5px;fill:#64748B}
      .msg{font-size:13.5px;fill:#1E3A5F;font-weight:600}
      .life{stroke:#CBD5E1;stroke-width:1.6;stroke-dasharray:5 5}
      .actR{fill:#DBEAFE;stroke:#3B82F6;stroke-width:1.2}
      .actA{fill:#FEF3C7;stroke:#D97706;stroke-width:1.2}
      .ln{stroke:#3B82F6;stroke-width:2;fill:none}
      .lnR{stroke:#3B82F6;stroke-width:1.8;fill:none;stroke-dasharray:6 4}
      .lnA{stroke:#D97706;stroke-width:2;fill:none}
      .lnAR{stroke:#D97706;stroke-width:1.8;fill:none;stroke-dasharray:6 4}
      .num{font-size:11px;font-weight:700;fill:#FFFFFF}
    </style>
  </defs>

  <rect width="1600" height="900" fill="#FFFFFF"/>
  <rect x="520" y="30" width="560" height="56" rx="14" fill="#EBF4FF" stroke="#2563EB" stroke-width="2"/>
  <text x="800" y="66" text-anchor="middle" font-size="25" font-weight="700" fill="#1D4ED8">一轮对话的读写时序</text>

  <!-- 相位标签 -->
  <rect x="30" y="330" width="26" height="150" rx="8" fill="#DBEAFE"/>
  <text x="43" y="352" font-size="14" font-weight="700" fill="#1D4ED8" text-anchor="middle">读</text>
  <text x="43" y="372" font-size="14" font-weight="700" fill="#1D4ED8" text-anchor="middle">路</text>
  <text x="43" y="392" font-size="14" font-weight="700" fill="#1D4ED8" text-anchor="middle">径</text>
  <rect x="30" y="560" width="26" height="180" rx="8" fill="#FEF3C7"/>
  <text x="43" y="592" font-size="14" font-weight="700" fill="#B45309" text-anchor="middle">写</text>
  <text x="43" y="612" font-size="14" font-weight="700" fill="#B45309" text-anchor="middle">路</text>
  <text x="43" y="632" font-size="14" font-weight="700" fill="#B45309" text-anchor="middle">径</text>

  <!-- 生命线头 -->
  <g>
    <rect class="box" x="90" y="112" width="180" height="54" rx="12"/>
    <text class="t" x="180" y="145" text-anchor="middle">QQ 用户</text>
    <rect class="box" x="330" y="112" width="180" height="54" rx="12"/>
    <text class="t" x="420" y="145" text-anchor="middle">dsh-qqbot</text>
    <rect class="box" x="570" y="112" width="180" height="54" rx="12"/>
    <text class="t" x="660" y="145" text-anchor="middle">Brain 插件</text>
    <rect class="box" x="810" y="112" width="180" height="54" rx="12"/>
    <text class="t" x="900" y="145" text-anchor="middle">聊天 LLM</text>
    <rect class="box" x="1050" y="112" width="180" height="54" rx="12"/>
    <text class="t" x="1140" y="145" text-anchor="middle">蒸馏 LLM</text>
    <rect class="box" x="1290" y="112" width="180" height="54" rx="12"/>
    <text class="t" x="1380" y="145" text-anchor="middle">brain.jsonl</text>
  </g>

  <!-- 生命线 -->
  <path class="life" d="M180 166 V820"/><path class="life" d="M420 166 V820"/>
  <path class="life" d="M660 166 V820"/><path class="life" d="M900 166 V820"/>
  <path class="life" d="M1140 166 V820"/><path class="life" d="M1380 166 V820"/>

  <!-- 激活条 -->
  <rect class="actR" x="413" y="210" width="14" height="270" rx="5"/>
  <rect class="actR" x="653" y="255" width="14" height="60" rx="5"/>
  <rect class="actA" x="653" y="560" width="14" height="215" rx="5"/>
  <rect class="actA" x="1133" y="620" width="14" height="60" rx="5"/>

  <!-- 1 发消息 -->
  <path class="ln" d="M188 210 H412" marker-end="url(#ar)"/>
  <circle cx="205" cy="195" r="9" fill="#3B82F6"/><text class="num" x="205" y="199" text-anchor="middle">1</text>
  <text class="msg" x="300" y="200" text-anchor="middle">发消息 [昵称 (openid)]</text>

  <!-- 2 assemble -->
  <path class="ln" d="M427 255 H645" marker-end="url(#ar)"/>
  <circle cx="445" cy="240" r="9" fill="#3B82F6"/><text class="num" x="445" y="244" text-anchor="middle">2</text>
  <text class="msg" x="538" y="245" text-anchor="middle">system-prompt/assemble</text>

  <!-- 3 返回 section -->
  <path class="lnR" d="M653 310 H435" marker-end="url(#ar)"/>
  <circle cx="745" cy="295" r="9" fill="#3B82F6"/><text class="num" x="745" y="299" text-anchor="middle">3</text>
  <text class="msg" x="545" y="300" text-anchor="middle">+7 section：人格·脉络·情绪·立场·记忆·发言人·时刻</text>

  <!-- 4 → LLM -->
  <path class="ln" d="M427 365 H893" marker-end="url(#ar)"/>
  <circle cx="450" cy="350" r="9" fill="#3B82F6"/><text class="num" x="450" y="354" text-anchor="middle">4</text>
  <text class="msg" x="660" y="355" text-anchor="middle">system prompt + 会话回放（含注入段）</text>

  <!-- 5 回复 -->
  <path class="lnR" d="M893 425 H435" marker-end="url(#ar)"/>
  <circle cx="850" cy="410" r="9" fill="#3B82F6"/><text class="num" x="850" y="414" text-anchor="middle">5</text>
  <text class="msg" x="664" y="415" text-anchor="middle">人格化回复</text>

  <!-- 6 发送 -->
  <path class="ln" d="M413 470 H188" marker-end="url(#ar)"/>
  <circle cx="395" cy="455" r="9" fill="#3B82F6"/><text class="num" x="395" y="459" text-anchor="middle">6</text>
  <text class="msg" x="300" y="460" text-anchor="middle">发送到 QQ</text>

  <!-- 轮末分隔 -->
  <path d="M80 525 H1520" stroke="#D97706" stroke-width="1.5" stroke-dasharray="8 6" fill="none"/>
  <rect x="730" y="512" width="140" height="26" rx="13" fill="#FFFBEB" stroke="#D97706" stroke-width="1.4"/>
  <text x="800" y="530" text-anchor="middle" font-size="13" font-weight="700" fill="#B45309">轮末 turn/end</text>

  <!-- 7 触发蒸馏 -->
  <path class="lnA" d="M427 565 H645" marker-end="url(#arA)"/>
  <circle cx="668" cy="550" r="9" fill="#D97706"/><text class="num" x="668" y="554" text-anchor="middle">7</text>
  <text class="msg" x="538" y="555" text-anchor="middle">本轮对话（用户消息队列≤8）</text>

  <!-- 8 蒸馏调用 -->
  <path class="lnA" d="M667 625 H1125" marker-end="url(#arA)"/>
  <circle cx="690" cy="610" r="9" fill="#D97706"/><text class="num" x="690" y="614" text-anchor="middle">8</text>
  <text class="msg" x="900" y="615" text-anchor="middle">蒸馏：对话 + 画像 + 情绪 + 已有记忆</text>

  <!-- 9 草稿返回 -->
  <path class="lnAR" d="M1125 685 H675" marker-end="url(#arA)"/>
  <circle cx="1100" cy="670" r="9" fill="#D97706"/><text class="num" x="1100" y="674" text-anchor="middle">9</text>
  <text class="msg" x="900" y="675" text-anchor="middle">记忆草稿 + 情绪(mood/PAD/增量) + 画像草稿</text>

  <!-- 10 自审 -->
  <path class="lnA" d="M674 735 C720 725 740 745 700 755" marker-end="url(#arA)"/>
  <circle cx="700" cy="720" r="9" fill="#D97706"/><text class="num" x="700" y="724" text-anchor="middle">10</text>
  <text class="msg" x="760" y="745">画像二次审核（审核章持久化）</text>

  <!-- 11 落盘 -->
  <path class="lnA" d="M674 785 H1372" marker-end="url(#arA)"/>
  <circle cx="700" cy="770" r="9" fill="#D97706"/><text class="num" x="700" y="774" text-anchor="middle">11</text>
  <text class="msg" x="1020" y="775" text-anchor="middle">op 流水追加 + 快照更新 → /brain 15s 轮询展示</text>

  <!-- 页脚 -->
  <rect x="400" y="838" width="800" height="40" rx="10" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.2" stroke-dasharray="6 4"/>
  <text x="800" y="863" text-anchor="middle" font-size="13" fill="#64748B">后台循环：语义巩固定时器 · embedding 回填 · 衰减/强化 · 近重复清扫 · 图谱边生成</text>
</svg>
