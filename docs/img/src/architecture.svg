<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="ar" markerWidth="11" markerHeight="11" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#3B82F6"/>
    </marker>
    <marker id="arG" markerWidth="11" markerHeight="11" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#94A3B8"/>
    </marker>
    <style>
      .box{fill:#EFF6FF;stroke:#3B82F6;stroke-width:1.6}
      .boxHot{fill:#DBEAFE;stroke:#2563EB;stroke-width:2.2}
      .boxGhost{fill:#F8FAFC;stroke:#94A3B8;stroke-width:1.4;stroke-dasharray:7 5}
      .t{font-size:17px;font-weight:700;fill:#1E3A5F}
      .s{font-size:13px;fill:#64748B}
      .lbl{font-size:12.5px;fill:#3B82F6;font-weight:600}
      .lblG{font-size:12.5px;fill:#64748B}
      .icon{stroke:#1E3A5F;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
      .iconF{fill:#1E3A5F}
      .ln{stroke:#3B82F6;stroke-width:2;fill:none}
      .lnG{stroke:#94A3B8;stroke-width:1.8;fill:none;stroke-dasharray:6 4}
    </style>
  </defs>

  <rect width="1600" height="900" fill="#FFFFFF"/>

  <!-- 标题 -->
  <rect x="530" y="34" width="540" height="58" rx="14" fill="#EBF4FF" stroke="#2563EB" stroke-width="2"/>
  <text x="800" y="71" text-anchor="middle" font-size="26" font-weight="700" fill="#1D4ED8">qqbot-brain · 系统架构总览</text>

  <!-- ═══ 左列：输入 ═══ -->
  <g>
    <rect class="box" x="70" y="230" width="250" height="120" rx="14"/>
    <circle cx="104" cy="262" r="15" class="icon"/>
    <path class="icon" d="M97 268 l14 8 v-13"/>
    <text class="t" x="132" y="268">QQ 群聊</text>
    <text class="s" x="92" y="300">@ 触发 · [昵称 (openid)]</text>
    <text class="s" x="92" y="324">多人对话归因</text>
  </g>
  <g>
    <rect class="box" x="70" y="440" width="250" height="120" rx="14"/>
    <circle cx="104" cy="472" r="15" class="icon"/>
    <path class="icon" d="M97 478 l14 8 v-13"/>
    <text class="t" x="132" y="478">QQ 私聊</text>
    <text class="s" x="92" y="510">C2C 直聊</text>
    <text class="s" x="92" y="534">平台风控入站拦截(黑盒)</text>
  </g>

  <!-- ═══ 中层：dsh 宿主 ═══ -->
  <rect class="boxGhost" x="400" y="160" width="640" height="580" rx="18"/>
  <text x="424" y="192" font-size="14" font-weight="600" fill="#64748B">dsh 宿主进程 · qqbot profile</text>

  <g>
    <rect class="box" x="445" y="215" width="550" height="150" rx="14"/>
    <rect x="472" y="243" width="30" height="24" rx="5" class="icon"/>
    <circle cx="481" cy="255" r="1.8" class="iconF"/>
    <circle cx="493" cy="255" r="1.8" class="iconF"/>
    <path class="icon" d="M487 243 v-8 m-6 0 h12"/>
    <text class="t" x="516" y="262">官方 @tencent-connect/dsh-qqbot</text>
    <text class="s" x="472" y="300">收发消息 · 会话回放 · system-prompt 组装瀑布</text>
    <text class="s" x="472" y="324">群聊 [Chat history] · mention 门控 · 官方工具</text>
    <text class="s" x="472" y="348">contextWindow 1M · compaction 兜底</text>
  </g>

  <!-- bot ↓↑ plugin 双通道 -->
  <path class="ln" d="M620 375 V470" marker-end="url(#ar)"/>
  <text class="lbl" x="608" y="428" text-anchor="end">注入 7 个 section</text>
  <path class="ln" d="M835 470 V375" marker-end="url(#ar)"/>
  <text class="lbl" x="847" y="428">捕获 session/event</text>

  <g>
    <rect class="boxHot" x="445" y="480" width="550" height="170" rx="14"/>
    <circle cx="487" cy="516" r="14" class="icon"/>
    <ellipse cx="487" cy="516" rx="14" ry="5.5" class="icon" transform="rotate(-25 487 516)"/>
    <text class="t" x="516" y="523">qqbot-brain（本插件）</text>
    <text class="s" x="472" y="560">人格内核 · 分层遗忘记忆 · 情绪(PAD+mood) · 态度</text>
    <text class="s" x="472" y="584">画像 · 会话脉络 · 检索注入 · 图谱边 · 管理面</text>
    <text class="s" x="472" y="608">蒸馏/审核/脉络/巩固 四路内部 LLM 调用</text>
    <rect x="472" y="624" width="245" height="16" rx="8" fill="#2563EB"/>
    <text x="494" y="636" font-size="11" fill="#FFFFFF" font-weight="600">独立 Cordis 插件 · 可单独摘除</text>
  </g>

  <!-- ═══ 右列：外部依赖 ═══ -->
  <g>
    <rect class="box" x="1110" y="160" width="420" height="105" rx="14"/>
    <path class="icon" d="M1142 196 a11 11 0 0 1 2 -21 a14 14 0 0 1 26 -4 a10 10 0 0 1 12 15 a8 8 0 0 1 -2 10 z" transform="translate(-8 4)"/>
    <text class="t" x="1192" y="200">聊天 LLM · DeepSeek</text>
    <text class="s" x="1140" y="230">每轮 1 次 · 人格化回复</text>
  </g>
  <g>
    <rect class="box" x="1110" y="305" width="420" height="105" rx="14"/>
    <path class="icon" d="M1142 341 a11 11 0 0 1 2 -21 a14 14 0 0 1 26 -4 a10 10 0 0 1 12 15 a8 8 0 0 1 -2 10 z" transform="translate(-8 4)"/>
    <text class="t" x="1192" y="345">蒸馏 LLM · DeepSeek</text>
    <text class="s" x="1140" y="375">轮末 ≤3 次：蒸馏/审核/脉络</text>
  </g>
  <g>
    <rect class="box" x="1110" y="450" width="420" height="105" rx="14"/>
    <circle cx="1140" cy="490" r="3" class="icon"/>
    <circle cx="1158" cy="482" r="3" class="icon"/>
    <circle cx="1150" cy="502" r="3" class="icon"/>
    <path class="icon" d="M1142 488 l14 -4 m-14 4 l6 11 m8 -14 l-6 15"/>
    <text class="t" x="1178" y="490">Embedding API</text>
    <text class="s" x="1140" y="520">OpenAI 兼容 · 缺省回退 n-gram</text>
  </g>
  <g>
    <rect class="box" x="1110" y="595" width="420" height="105" rx="14"/>
    <ellipse cx="1148" cy="622" rx="15" ry="6" class="icon"/>
    <path class="icon" d="M1133 622 v18 a15 6 0 0 0 30 0 v-18"/>
    <text class="t" x="1178" y="632">~/brain-data</text>
    <text class="s" x="1140" y="662">persona.md · brain.jsonl · 快照</text>
    <text class="s" x="1140" y="684">op 流水全审计 · 可重放</text>
  </g>

  <!-- ═══ 箭头：左→中 ═══ -->
  <path class="ln" d="M320 290 H438" marker-end="url(#ar)"/>
  <path class="ln" d="M320 500 C380 500 380 340 438 325" marker-end="url(#ar)"/>
  <text class="lblG" x="335" y="282">消息事件</text>

  <!-- ═══ 箭头：中→右 ═══ -->
  <path class="ln" d="M995 275 C1050 275 1050 215 1103 215" marker-end="url(#ar)"/>
  <text class="lblG" x="1005" y="248">注入后 prompt</text>

  <path class="ln" d="M995 545 C1050 545 1050 360 1103 358" marker-end="url(#ar)"/>
  <text class="lblG" x="1005" y="500">轮末蒸馏</text>

  <path class="ln" d="M995 575 C1050 575 1050 502 1103 502" marker-end="url(#ar)"/>
  <text class="lblG" x="1018" y="540">语义向量</text>

  <path class="ln" d="M995 605 C1050 605 1050 650 1103 650" marker-end="url(#ar)"/>
  <text class="lblG" x="1024" y="628">写入</text>

  <!-- ═══ /brain 页 ═══ -->
  <g>
    <rect class="box" x="445" y="780" width="400" height="96" rx="14"/>
    <rect x="472" y="806" width="36" height="26" rx="4" class="icon"/>
    <path class="icon" d="M472 814 h36"/>
    <text class="t" x="522" y="824">/brain 脑图页</text>
    <text class="s" x="472" y="856">鲸脑皮层可视化 + 管理面 · :4099</text>
  </g>
  <path class="ln" d="M645 650 V773" marker-end="url(#ar)"/>
  <text class="lblG" x="657" y="712">15s 轮询 · token 鉴权</text>
</svg>
