<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="arG" markerWidth="11" markerHeight="11" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#94A3B8"/>
    </marker>
    <style>
      .box{fill:#F8FAFC;stroke:#94A3B8;stroke-width:1.5}
      .t{font-size:17px;font-weight:700;fill:#1E3A5F}
      .tt{font-size:15px;font-weight:700;fill:#1E3A5F}
      .s{font-size:12.5px;fill:#64748B}
      .lblG{font-size:12.5px;fill:#64748B}
      .brain{fill:#F8FAFF;stroke:#3B82F6;stroke-width:2.4}
      .fold{stroke:#93C5FD;stroke-width:1.4;fill:none;opacity:.7}
      .lnG{stroke:#94A3B8;stroke-width:1.6;fill:none;stroke-dasharray:5 4}
    </style>
  </defs>

  <rect width="1600" height="900" fill="#FFFFFF"/>
  <rect x="520" y="34" width="560" height="56" rx="14" fill="#EBF4FF" stroke="#2563EB" stroke-width="2"/>
  <text x="800" y="70" text-anchor="middle" font-size="25" font-weight="700" fill="#1D4ED8">大肥鱼的鲸脑皮层 · 记忆按脑区安放</text>

  <!-- ═══ 脑轮廓（侧剖面，朝左） ═══ -->
  <path class="brain" d="
    M 230 620
    C 170 555 160 445 205 350
    C 235 250 330 180 470 165
    C 600 145 740 165 830 235
    C 905 295 925 385 890 455
    C 925 490 915 555 850 585
    C 800 650 715 670 655 650
    C 620 680 600 700 575 690
    C 565 720 545 730 520 715
    C 480 700 440 690 390 685
    C 310 685 260 665 230 620 Z"/>

  <!-- 皮层褶皱示意 -->
  <path class="fold" d="M300 300 C 360 260 430 250 500 270"/>
  <path class="fold" d="M560 210 C 640 195 730 215 790 260"/>
  <path class="fold" d="M690 420 C 760 400 830 420 860 470"/>
  <path class="fold" d="M330 580 C 400 610 480 615 540 600"/>

  <!-- ═══ 脑区 ═══ -->
  <ellipse cx="345" cy="345" rx="92" ry="74" fill="#DBEAFE" opacity="0.85"/>
  <text class="tt" x="345" y="330" text-anchor="middle">前额叶</text>
  <text class="tt" x="345" y="354" text-anchor="middle" font-size="13.5">人格内核 persona.md</text>
  <text class="s" x="345" y="376" text-anchor="middle">常量 · 只读</text>

  <ellipse cx="575" cy="252" rx="112" ry="62" fill="#EDE9FE" opacity="0.85"/>
  <text class="tt" x="575" y="240" text-anchor="middle">新皮层</text>
  <text class="tt" x="575" y="264" text-anchor="middle" font-size="13.5">semantic 语义记忆</text>
  <text class="s" x="575" y="286" text-anchor="middle">长期知识 · 跨会话</text>

  <ellipse cx="745" cy="350" rx="82" ry="64" fill="#CFFAFE" opacity="0.9"/>
  <text class="tt" x="745" y="338" text-anchor="middle">顶叶</text>
  <text class="tt" x="745" y="362" text-anchor="middle" font-size="13.5">attitude 态度</text>
  <text class="s" x="745" y="384" text-anchor="middle">慢变量 · 被塑造</text>

  <ellipse cx="560" cy="545" rx="106" ry="64" fill="#D1FAE5" opacity="0.9"/>
  <text class="tt" x="560" y="532" text-anchor="middle">海马体</text>
  <text class="tt" x="560" y="556" text-anchor="middle" font-size="13.5">episodic 情景记忆</text>
  <text class="s" x="560" y="578" text-anchor="middle">衰减 · 巩固 · 遗忘</text>

  <ellipse cx="385" cy="505" rx="62" ry="52" fill="#FCE7F3" opacity="0.9"/>
  <text class="tt" x="385" y="492" text-anchor="middle" font-size="13.5">杏仁核</text>
  <text class="tt" x="385" y="514" text-anchor="middle" font-size="12.5">emotion 情绪</text>
  <text class="s" x="385" y="534" text-anchor="middle" font-size="11.5">PAD+mood</text>

  <!-- ═══ 右侧注释卡 ═══ -->
  <g>
    <rect class="box" x="1000" y="230" width="500" height="130" rx="14"/>
    <text class="t" x="1030" y="272">会话脉络 digest →「脊髓 / 传导束」</text>
    <text class="s" x="1030" y="304">每 15 轮滚动摘要：主线 + 未完结约定</text>
    <text class="s" x="1030" y="328">transcript 之外的第二条时间轴</text>
    <path class="lnG" d="M1000 310 C900 340 800 520 660 640" marker-end="url(#arG)"/>
  </g>
  <g>
    <rect class="box" x="1000" y="420" width="500" height="130" rx="14"/>
    <text class="t" x="1030" y="462">画像 profiles u:openid →「丘脑」</text>
    <text class="s" x="1030" y="494">识别谁在说话：性格/关系/稳定偏好</text>
    <text class="s" x="1030" y="518">发言人画像随记忆摘录按人注入</text>
    <path class="lnG" d="M1000 470 C920 470 830 440 760 420" marker-end="url(#arG)"/>
  </g>
  <g>
    <rect class="box" x="1000" y="610" width="500" height="130" rx="14"/>
    <text class="t" x="1030" y="652">brain.jsonl + 快照 →「可解剖的脑」</text>
    <text class="s" x="1030" y="684">op 流水全审计可重放 · 图谱边后端化</text>
    <text class="s" x="1030" y="708">/brain 页 15s 轮询 · 管理面入口</text>
    <path class="lnG" d="M1000 660 C940 660 880 630 800 590" marker-end="url(#arG)"/>
  </g>

  <!-- 角标 -->
  <text class="lblG" x="200" y="800">情绪增强：强情绪场景形成的记忆初始强度最高 +50%</text>
  <text class="lblG" x="200" y="826">衰减：R=e^(−t/S) · 命中强化 S+1 · 30 天物理遗忘</text>
</svg>
