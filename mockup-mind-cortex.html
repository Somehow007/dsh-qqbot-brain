<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>① 鲸脑皮层 · 大肥鱼心智图谱</title>
<style>
:root{--line:#163350;--ink:#d8ecff;--mute:#6d8db0;--cy:#5fe0ff;--persona:#8fb4ff;--semantic:#5fe0ff;--episodic:#7f8cff;--attitude:#e09cff}
*{box-sizing:border-box;margin:0;padding:0}
body{background:radial-gradient(1100px 720px at 36% 52%,#0c2c4d 0%,#06162a 46%,#020812 100%);color:var(--ink);font:14px/1.5 "PingFang SC","Microsoft YaHei",system-ui,sans-serif;min-height:100vh;overflow:hidden}
.mono{font-family:"SF Mono",Menlo,Consolas,monospace;letter-spacing:.14em}
header{height:58px;display:flex;align-items:center;gap:12px;padding:0 26px;border-bottom:1px solid var(--line);background:#030c18cc}
header img{width:34px;height:34px;border-radius:50%;object-fit:cover;object-position:50% 52%;border:1px solid #2f6aa8}
.brand b{display:block;font-size:12px;letter-spacing:.24em;font-weight:600}
.brand small{display:block;font-size:10px;color:var(--mute)}
.status{margin-left:auto;display:flex;gap:22px;font-size:10px;color:var(--mute)}
.status b{color:var(--ink);font-weight:500}
.dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:#5fdcc8;box-shadow:0 0 8px #5fdcc8;margin-right:7px;vertical-align:1px;animation:blink 2.4s infinite}
@keyframes blink{50%{opacity:.35}}
.wrap{display:grid;grid-template-columns:1fr 360px;height:calc(100vh - 58px);min-height:620px}
.stage{position:relative;overflow:hidden}
.stage-head{position:absolute;left:30px;top:24px;z-index:2;pointer-events:none}
.eyebrow{font-size:10px;color:var(--cy)}
h1{font-size:26px;font-weight:600;letter-spacing:.06em;margin-top:6px}
.sub{color:var(--mute);font-size:12px;margin-top:4px;max-width:420px}
#brain{position:absolute;inset:0;width:100%;height:100%;display:block}
.legend{position:absolute;left:30px;bottom:20px;display:flex;gap:18px;font-size:11px;color:var(--mute);align-items:center}
.legend svg{vertical-align:-2px;margin-right:6px}
.ctrl{position:absolute;right:24px;bottom:16px;display:flex;gap:8px}
button{font:inherit;font-size:11px;color:var(--ink);background:#071a2f;border:1px solid var(--line);padding:6px 12px;cursor:pointer}
button:hover{border-color:#2c5d8a}
button.on{border-color:var(--cy);color:var(--cy)}
aside{border-left:1px solid var(--line);background:linear-gradient(#061528,#030c19);display:flex;flex-direction:column;overflow:auto}
.persona{position:relative;height:210px;flex:none;display:flex;align-items:flex-start;padding:22px 18px;border-bottom:1px solid var(--line);overflow:hidden;background:linear-gradient(90deg,#061528 8%,#06152800 62%),url(mockup-atlas-persona-smile.png) 78% 22%/auto 150% no-repeat}
.persona:after{content:"";position:absolute;inset:0;background:linear-gradient(#06152800 55%,#061528);pointer-events:none}
.bubble{position:relative;z-index:1;max-width:178px;background:#eaf4ff;color:#14305a;border-radius:14px 14px 14px 4px;padding:10px 13px;font-size:13px;line-height:1.55;box-shadow:0 8px 24px #0009;transition:transform .2s}
.bubble.pop{transform:scale(1.04)}
.bubble small{display:block;color:#5a7aa8;font-size:10px;margin-bottom:3px;letter-spacing:.1em}
.sec{padding:16px 20px;border-bottom:1px solid var(--line)}
.sec h3{font-size:10px;color:var(--mute);font-weight:400;margin-bottom:10px}
.chip{display:inline-block;font-size:10px;padding:1px 8px;border:1px solid currentColor;border-radius:10px;letter-spacing:.1em}
.title{font-size:18px;font-weight:600;margin:8px 0 4px}
.text{color:#a6c0da;font-size:13px}
.meta{display:flex;gap:16px;font-size:11px;color:var(--mute);margin-top:10px}
.bar{height:3px;background:#11253c;margin-top:8px}.bar>i{display:block;height:100%}
.rel{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px dashed #15304a;cursor:pointer}
.rel:first-of-type{border-top:0}
.rel:hover b{color:#fff}
.rel>i{flex:none;width:8px;height:8px;border-radius:50%;margin-top:7px}
.rel b{display:block;font-size:13px;font-weight:500;color:#cfe3f7}
.rel small{display:block;color:var(--mute);font-size:11px}
.rel em{margin-left:auto;font-style:normal;font-size:10px;color:var(--mute);white-space:nowrap;padding-top:3px}
.meters{display:grid;gap:7px}
.meter{display:grid;grid-template-columns:72px 1fr 34px;align-items:center;gap:10px;font-size:12px;color:#a6c0da;cursor:pointer}
.meter:hover{color:#fff}
.meter .bar{margin:0}
.meter span:last-child{font-size:10px;color:var(--mute);text-align:right}
.hint{color:var(--mute);font-size:12px}
/* svg */
.shell{fill:url(#shellFill);stroke:#3f8fd0;stroke-opacity:.55;stroke-width:1.2}
.shell-glow{fill:none;stroke:#3fa4ff;stroke-opacity:.35;stroke-width:8;filter:url(#blur)}
.sulcus{fill:none;stroke:#59a8e6;stroke-opacity:.16;stroke-width:1.3;stroke-linecap:round}
.spark{fill:#a8deff;animation:tw 5s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.08}50%{opacity:.75}}
.rlabel{font:10px "SF Mono",Menlo,monospace;letter-spacing:.16em;fill:#6f97bf}
.rlabel tspan.cn{font-family:"PingFang SC",sans-serif;letter-spacing:.1em;fill:#b5d2ee;font-size:12px}
.leader{stroke:#3a6c98;stroke-width:.8;stroke-dasharray:2 3;fill:none}
.edge{fill:none;stroke:#62b8ea;stroke-opacity:.26;stroke-width:1;stroke-dasharray:3 4;transition:stroke-opacity .15s}
.edge.k-consolidate{stroke-dasharray:none;stroke-opacity:.34}
.edge.hidden{stroke-opacity:0}
.edge.lit{stroke-opacity:.95;stroke-width:1.5}
.dim .edge:not(.lit){stroke-opacity:.05}
.dim .edge.hidden:not(.lit){stroke-opacity:0}
.node{cursor:pointer;transition:opacity .15s}
.node .halo{opacity:0;transition:opacity .15s}
.node:hover .halo,.node.sel .halo{opacity:.32}
.node text{font-size:11.5px;fill:#bcd6ee;paint-order:stroke;stroke:#04101e;stroke-width:3.5px;stroke-linejoin:round;pointer-events:none}
.node.k-trait text{font-size:12.5px;fill:#e2eeff;font-weight:600}
.dim .node:not(.lit){opacity:.2}
.node.sel text{fill:#fff}
.mood-ring{fill:none;stroke-width:1.2;animation:beat 2.6s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes beat{0%{transform:scale(1);opacity:.8}100%{transform:scale(2.6);opacity:0}}
.pulse{pointer-events:none}
@media (prefers-reduced-motion:reduce){.spark,.mood-ring,.dot{animation:none}}
</style>
</head>
<body>
<header>
  <img src="mockup-atlas-persona-chibi.png" alt="大肥鱼">
  <div class="brand"><b class="mono">DAFEIYU · CORTEX</b><small>大肥鱼的鲸脑皮层</small></div>
  <div class="status mono">
    <span><i class="dot"></i>人格内核 <b>在线</b></span>
    <span>记忆 <b id="cntM">0</b></span>
    <span>关联 <b id="cntL">0</b></span>
    <span>当前心情 <b id="moodNow">—</b></span>
  </div>
</header>
<div class="wrap">
  <main class="stage">
    <div class="stage-head">
      <div class="eyebrow mono">CONCEPT ① · WHALE CORTEX</div>
      <h1>大肥鱼的鲸脑皮层</h1>
      <p class="sub">记忆按脑区安放：前额叶管人格，新皮层存知识，海马体记经历，杏仁核染情绪。点亮一个神经元，看信号流向哪里。</p>
    </div>
    <svg id="brain" viewBox="0 0 1000 620" preserveAspectRatio="xMidYMid meet">
      <defs>
        <radialGradient id="shellFill" cx="45%" cy="45%" r="60%">
          <stop offset="0" stop-color="#0f3660" stop-opacity=".75"/>
          <stop offset="1" stop-color="#071a31" stop-opacity=".55"/>
        </radialGradient>
        <filter id="blur" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="6"/></filter>
        <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3"/></filter>
      </defs>
      <g id="anatomy"></g>
      <g id="sparks"></g>
      <g id="labels"></g>
      <g id="edges"></g>
      <g id="pulses"></g>
      <g id="nodes"></g>
    </svg>
    <div class="legend">
      <span><svg width="14" height="14"><polygon points="7,1 12.5,4 12.5,10 7,13 1.5,10 1.5,4" fill="#081a30" stroke="#8fb4ff"/></svg>人格特质</span>
      <span><svg width="12" height="12"><circle cx="6" cy="6" r="5" fill="#ffc95c"/></svg>情绪</span>
      <span><svg width="14" height="14"><circle cx="7" cy="7" r="5.5" fill="#061426" stroke="#8f96ff" stroke-width="1.5"/></svg>记忆（情景/语义/态度）</span>
      <span><svg width="26" height="8"><line x1="0" y1="4" x2="26" y2="4" stroke="#62b8ea" stroke-dasharray="3 4"/></svg>推断关联</span>
      <span><svg width="26" height="8"><line x1="0" y1="4" x2="26" y2="4" stroke="#62b8ea"/></svg>巩固沉淀</span>
    </div>
    <div class="ctrl">
      <button id="signal" class="on">神经信号 · 开</button>
      <button id="reset">复位</button>
    </div>
  </main>
  <aside>
    <div class="persona">
      <div class="bubble" id="bubble"><small class="mono">大肥鱼</small><span id="sayText"></span></div>
    </div>
    <div id="panel"></div>
  </aside>
</div>
<script src="mockup-mind-data.js"></script>
<script>
const M = MIND, NS = 'http://www.w3.org/2000/svg';
const $ = s => document.querySelector(s);
const el = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); parent && parent.appendChild(e); return e; };
const SHORT = { m13: '生日祝福', m1: '女仆装事件', m4: '深夜陪聊', m3: '信任阿杰', m8: '没人回', m2: 'token 口粮', m7: '“大肥鱼”称呼', m9: '冰美式', m10: '抓 bug', m14: '4 空格缩进', m5: '鲸是哺乳类', m11: '讨厌催更', m12: '群规', m6: '初次被叫' };
const POS = {
  t1: [252, 212], t2: [338, 188], t3: [226, 298], t4: [418, 222], t5: [318, 288],
  e1: [338, 382], e4: [396, 362], e5: [450, 388], e3: [372, 424], e2: [428, 432],
  m13: [505, 392], m4: [602, 392], m10: [700, 380], m1: [482, 440], m8: [572, 442], m6: [650, 428],
  m2: [500, 142], m9: [612, 130], m14: [560, 216], m5: [690, 204], m12: [484, 262],
  m3: [712, 270], m7: [738, 336], m11: [628, 318],
};
const COLOR = id => { const k = M.kindOf(id), n = M.byId[id]; return k === 'trait' ? '#8fb4ff' : k === 'emotion' ? n.color : getComputedStyle(document.documentElement).getPropertyValue('--' + n.type).trim(); };

// ── 解剖结构 ──
function smooth(pts) {
  const n = pts.length; let d = `M${pts[0][0]},${pts[0][1]}`;
  for (let i = 0; i < n; i++) {
    const p0 = pts[(i - 1 + n) % n], p1 = pts[i], p2 = pts[(i + 1) % n], p3 = pts[(i + 2) % n];
    d += ` C${p1[0] + (p2[0] - p0[0]) / 6},${p1[1] + (p2[1] - p0[1]) / 6} ${p2[0] - (p3[0] - p1[0]) / 6},${p2[1] - (p3[1] - p1[1]) / 6} ${p2[0]},${p2[1]}`;
  }
  return d + 'Z';
}
const CEREBRUM = smooth([[205,185],[275,128],[375,92],[490,80],[605,88],[705,120],[785,175],[835,245],[848,320],[825,385],[770,425],[690,440],[610,452],[520,470],[420,478],[340,465],[300,442],[292,418],[266,404],[226,392],[186,340],[170,262]]);
const CEREBELLUM = smooth([[662,452],[712,428],[790,418],[842,442],[852,488],[808,520],[730,524],[676,500]]);
const STEM = 'M612,452 C618,500 610,540 596,590 L640,590 C652,540 664,500 670,458Z';
const SULCI = [
  'M282,408 C360,384 450,352 560,332 C602,324 630,302 642,282',
  'M520,84 C515,150 500,220 480,262 C470,286 482,312 470,340',
  'M332,448 C420,424 520,410 640,384',
  'M232,200 C300,190 360,212 422,180',
  'M206,282 C270,262 332,292 410,262',
  'M602,120 C640,170 660,212 724,232',
  'M700,302 C742,292 790,322 832,300',
  'M760,382 C790,362 810,372 842,352',
  'M560,96 C580,140 620,150 650,190',
  'M380,110 C390,150 420,160 430,140',
];
const anat = $('#anatomy');
el('path', { d: CEREBELLUM, class: 'shell', opacity: .8 }, anat);
[0, 1, 2, 3].forEach(i => el('path', { d: `M${690 + i * 6},${446 + i * 16} C${740},${434 + i * 18} ${800},${438 + i * 16} ${842 - i * 4},${456 + i * 14}`, class: 'sulcus' }, anat));
el('path', { d: STEM, class: 'shell', opacity: .7 }, anat);
el('path', { d: CEREBRUM, class: 'shell-glow' }, anat);
el('path', { d: CEREBRUM, class: 'shell' }, anat);
SULCI.forEach(d => el('path', { d, class: 'sulcus' }, anat));
// 脑区柔光
[['#8fb4ff', 300, 250, 120, 95], ['#5fe0ff', 590, 180, 170, 80], ['#c99cff', 700, 300, 90, 80], ['#ffc95c', 395, 405, 80, 50], ['#8f96ff', 590, 418, 150, 45]]
  .forEach(([c, cx, cy, rx, ry]) => el('ellipse', { cx, cy, rx, ry, fill: c, opacity: .07, filter: 'url(#blur)' }, anat));

// 星点神经元（在脑轮廓内取样）
(function sparks() {
  const ctx = document.createElement('canvas').getContext('2d');
  const p1 = new Path2D(CEREBRUM), p2 = new Path2D(CEREBELLUM), g = $('#sparks');
  let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  let made = 0, tries = 0;
  while (made < 560 && tries < 9000) {
    tries++;
    const x = 160 + rnd() * 700, y = 75 + rnd() * 460;
    if (!ctx.isPointInPath(p1, x, y) && !ctx.isPointInPath(p2, x, y)) continue;
    const c = el('circle', { cx: x.toFixed(1), cy: y.toFixed(1), r: (.5 + rnd() * 1.1).toFixed(2), class: 'spark' }, g);
    c.style.animationDelay = (-rnd() * 5).toFixed(2) + 's';
    c.style.animationDuration = (3.5 + rnd() * 4).toFixed(2) + 's';
    made++;
  }
})();

// 脑区标注（引线在外）
const lab = $('#labels');
[[40, 168, 196, 214, 'PREFRONTAL', '前额叶 · 人格'],
 [520, 30, 560, 84, 'NEOCORTEX', '新皮层 · 语义'],
 [868, 220, 840, 268, 'PARIETAL', '顶叶 · 态度'],
 [210, 540, 360, 440, 'AMYGDALA', '杏仁核 · 情绪'],
 [440, 568, 540, 466, 'HIPPOCAMPUS', '海马体 · 情景']]
  .forEach(([x, y, lx, ly, en, cn]) => {
    el('path', { d: `M${x + (x > lx ? 0 : 60)},${y + 6} L${lx},${ly}`, class: 'leader' }, lab);
    const t = el('text', { x, y, class: 'rlabel' }, lab);
    el('tspan', { x, dy: 0 }, t).textContent = en;
    el('tspan', { x, dy: 16, class: 'cn' }, t).textContent = cn;
  });

// ── 关联边 ──
const EDGES = [];
function curve(a, b, bend) {
  const [x1, y1] = POS[a], [x2, y2] = POS[b], mx = (x1 + x2) / 2, my = (y1 + y2) / 2, dx = x2 - x1, dy = y2 - y1;
  return `M${x1},${y1} Q${mx - dy * bend},${my + dx * bend} ${x2},${y2}`;
}
const eg = $('#edges');
M.links.forEach(([a, b, kind]) => EDGES.push({ a, b, kind, path: el('path', { d: curve(a, b, .2), class: 'edge k-' + kind }, eg) }));
M.memories.forEach(m => {
  EDGES.push({ a: m.id, b: m.emo, kind: 'emotion', path: el('path', { d: curve(m.id, m.emo, -.12), class: 'edge hidden' }, eg) });
  EDGES.push({ a: m.id, b: m.trait, kind: 'trait', path: el('path', { d: curve(m.id, m.trait, .14), class: 'edge hidden' }, eg) });
});
EDGES.forEach(e => (e.len = e.path.getTotalLength()));

// ── 节点 ──
const nodeEls = {}, ng = $('#nodes');
function hex(r) { return Array.from({ length: 6 }, (_, i) => { const a = Math.PI / 6 + i * Math.PI / 3; return (Math.cos(a) * r).toFixed(1) + ',' + (Math.sin(a) * r).toFixed(1); }).join(' '); }
Object.keys(POS).forEach(id => {
  const n = M.byId[id], k = M.kindOf(id), c = COLOR(id), [x, y] = POS[id];
  const g = el('g', { class: 'node k-' + k, transform: `translate(${x},${y})`, tabindex: 0 }, ng);
  let r;
  if (k === 'trait') {
    r = 11 + n.v * 5;
    el('circle', { r: r + 12, fill: c, class: 'halo', filter: 'url(#soft)' }, g);
    el('polygon', { points: hex(r), fill: '#081a30', stroke: c, 'stroke-width': 1.6 }, g);
    el('polygon', { points: hex(r * .45), fill: c, opacity: .85 }, g);
  } else if (k === 'emotion') {
    r = 5 + n.v * 5;
    el('circle', { r: r + 10, fill: c, class: 'halo', filter: 'url(#soft)' }, g);
    if (id === M.mood.now) el('circle', { r, stroke: c, class: 'mood-ring' }, g);
    el('circle', { r, fill: c, opacity: .9 }, g);
  } else {
    r = 5 + n.str * 6;
    el('circle', { r: r + 10, fill: c, class: 'halo', filter: 'url(#soft)' }, g);
    el('circle', { r, fill: '#061426', stroke: c, 'stroke-width': 1.6 }, g);
    el('circle', { r: r * .32, fill: c }, g);
  }
  const label = k === 'memory' ? SHORT[id] : n.name;
  const t = el('text', k === 'memory' ? { x: r + 6, y: 4 } : { y: r + 15, 'text-anchor': 'middle' }, g);
  t.textContent = label;
  g.addEventListener('click', ev => { ev.stopPropagation(); select(id); });
  g.addEventListener('keydown', ev => { if (ev.key === 'Enter') select(id); });
  nodeEls[id] = g;
});
$('#brain').addEventListener('click', () => select(null));

// ── 神经信号脉冲 ──
let signalOn = !matchMedia('(prefers-reduced-motion: reduce)').matches;
const pulses = [], pg = $('#pulses');
function fire(edge, fromId, delay = 0, color) {
  const dots = [0, 1, 2].map(i => el('circle', { r: 2.6 - i * .7, fill: color || '#bfeaff', opacity: 1 - i * .3, class: 'pulse', filter: i ? '' : 'url(#soft)' }, pg));
  const glow = el('circle', { r: 2.2, fill: '#fff', class: 'pulse' }, pg);
  pulses.push({ edge, rev: edge.b === fromId, t0: performance.now() + delay, dur: 520 + edge.len * 2.2, dots: [glow, ...dots] });
  if (!raf) raf = requestAnimationFrame(tick);
}
let raf = 0;
function tick(now) {
  for (let i = pulses.length - 1; i >= 0; i--) {
    const p = pulses[i], t = (now - p.t0) / p.dur;
    if (t < 0) { p.dots.forEach(d => d.setAttribute('opacity', 0)); continue; }
    if (t > 1) { p.dots.forEach(d => d.remove()); pulses.splice(i, 1); continue; }
    p.dots.forEach((d, j) => {
      const tt = Math.max(0, t - j * .035), e = tt < .5 ? 2 * tt * tt : 1 - Math.pow(-2 * tt + 2, 2) / 2;
      const pt = p.edge.path.getPointAtLength(p.edge.len * (p.rev ? 1 - e : e));
      d.setAttribute('cx', pt.x); d.setAttribute('cy', pt.y);
      d.setAttribute('opacity', (j === 0 ? 1 : .7 - j * .2) * Math.sin(Math.PI * t) * 1.2);
    });
  }
  raf = pulses.length ? requestAnimationFrame(tick) : 0;
}
setInterval(() => {
  if (!signalOn || document.hidden || pulses.length > 10) return;
  const pool = SEL ? EDGES.filter(e => e.a === SEL || e.b === SEL) : EDGES;
  const e = pool[Math.floor(Math.random() * pool.length)];
  if (e) fire(e, SEL && e.b === SEL ? e.b : e.a, 0, SEL ? COLOR(SEL) : undefined);
}, 650);

// ── 选择与面板 ──
let SEL = null;
function select(id) {
  SEL = id;
  const svg = $('#brain'), lit = new Set(id ? [id, ...M.neighbors(id).map(n => n.id)] : []);
  svg.classList.toggle('dim', !!id);
  Object.entries(nodeEls).forEach(([k, g]) => { g.classList.toggle('lit', lit.has(k)); g.classList.toggle('sel', k === id); });
  EDGES.forEach(e => {
    const on = !!id && (e.a === id || e.b === id);
    e.path.classList.toggle('lit', on);
    e.path.style.stroke = on ? COLOR(e.a === id ? e.b : e.a) : '';
  });
  if (id && signalOn) {
    const first = EDGES.filter(e => e.a === id || e.b === id);
    first.forEach((e, i) => fire(e, id, i * 40, COLOR(id)));
    first.forEach(e => {
      const nb = e.a === id ? e.b : e.a;
      if (M.kindOf(nb) === 'memory') EDGES.filter(x => x.kind !== 'emotion' && x.kind !== 'trait' && x !== e && (x.a === nb || x.b === nb)).forEach(x => fire(x, nb, 520, COLOR(nb)));
    });
  }
  panel();
}
function speak(text) { $('#sayText').textContent = text; const b = $('#bubble'); b.classList.add('pop'); setTimeout(() => b.classList.remove('pop'), 180); }
function relRow(r) {
  const n = M.byId[r.id], name = M.kindOf(r.id) === 'memory' ? n.title : n.name;
  return `<div class="rel" data-id="${r.id}"><i style="background:${COLOR(r.id)}"></i><div><b>${name}</b><small>${r.reason}</small></div><em>${r.rel}</em></div>`;
}
function meters() {
  return `<div class="sec"><h3 class="mono">PERSONA · 人格光谱</h3><div class="meters">${M.traits.map(t => `<div class="meter" data-id="${t.id}"><span>${t.name}</span><div class="bar"><i style="width:${t.v * 100}%;background:#8fb4ff"></i></div><span>${Math.round(t.v * 100)}</span></div>`).join('')}</div></div>
  <div class="sec"><h3 class="mono">AMYGDALA · 情绪读数</h3><div class="meters">${M.emotions.map(e => `<div class="meter" data-id="${e.id}"><span>${e.name}${e.id === M.mood.now ? ' ●' : ''}</span><div class="bar"><i style="width:${e.v * 100}%;background:${e.color}"></i></div><span>${Math.round(e.v * 100)}</span></div>`).join('')}</div></div>`;
}
function panel() {
  const p = $('#panel');
  if (!SEL) {
    speak(M.mood.line);
    p.innerHTML = `<div class="sec"><h3 class="mono">INSPECTOR</h3><p class="hint">点任意一个神经元——记忆、情绪或人格——看它连着谁、为什么连着。</p></div>` + meters();
  } else {
    const n = M.byId[SEL], k = M.kindOf(SEL), rel = M.neighbors(SEL), c = COLOR(SEL);
    speak(k === 'memory' ? n.say : M.say[k](n));
    const groups = { 记忆: rel.filter(r => M.kindOf(r.id) === 'memory'), 情绪: rel.filter(r => M.kindOf(r.id) === 'emotion'), 人格: rel.filter(r => M.kindOf(r.id) === 'trait') };
    const head = k === 'memory'
      ? `<span class="chip" style="color:${c}">${M.T[n.type]}记忆</span><div class="title">${n.title}</div><p class="text">${n.text}</p>
         <div class="meta"><span>来源 · ${n.who}</span><span>${n.day < 1 ? '今天' : Math.round(n.day) + ' 天前'}</span><span>强度 ${Math.round(n.str * 100)}%</span></div><div class="bar"><i style="width:${n.str * 100}%;background:${c}"></i></div>`
      : `<span class="chip" style="color:${c}">${k === 'trait' ? '人格特质' : '情绪'} · ${n.en}</span><div class="title">${n.name}</div><p class="text">${k === 'trait' ? '由 ' + rel.length + ' 条记忆共同塑造' : '有 ' + rel.length + ' 条记忆带着这种情绪'}</p><div class="bar"><i style="width:${n.v * 100}%;background:${c}"></i></div>`;
    p.innerHTML = `<div class="sec">${head}</div>` + Object.entries(groups).filter(([, v]) => v.length).map(([g, v]) => `<div class="sec"><h3 class="mono">LINKED · ${g} ${v.length}</h3>${v.map(relRow).join('')}</div>`).join('');
  }
  p.querySelectorAll('[data-id]').forEach(r => r.addEventListener('click', () => select(r.dataset.id)));
}
$('#signal').onclick = e => { signalOn = !signalOn; e.target.classList.toggle('on', signalOn); e.target.textContent = '神经信号 · ' + (signalOn ? '开' : '关'); };
$('#reset').onclick = () => select(null);
$('#cntM').textContent = M.memories.length;
$('#cntL').textContent = M.links.length + M.memories.length * 2;
$('#moodNow').textContent = M.byId[M.mood.now].name;
panel();
if (location.hash) select(location.hash.slice(1));
</script>
</body>
</html>
